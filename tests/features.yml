      - id: setup.path-qemu
        what: The QEMU path (Linux, macOS) - install QEMU, Vagrant and vagrant-qemu, test a VM (software emulation without KVM).
        platforms:
          - linux
          - macos
        providers:
          - qemu
        host: true
        tests:
          unit:
            - src-tauri/src/machine/setup/tests.rs > a_mac_with_docker_and_no_vagrant_sets_up_only_the_vm_path
            - src-tauri/src/machine/selftest/vm.rs > qemu_test_vm_falls_back_to_software_emulation_without_kvm
            - src-tauri/src/machine/tools/install.rs > macos_installs_through_homebrew
          integration:
            - setup
          setup:
            - qemu
            - vagrant
            - plugin:vagrant-qemu
            - selftest:vm
        rig:
          - machine-setup@qemu
          - docker-vm@qemu
        gaps:
          web: no spec walks the QEMU path
          integration: not run on any OS; the guided setup's paths never run on macOS on the rig

      - id: setup.path-utm
        what: The UTM path on macOS - install UTM (Homebrew cask), Vagrant and vagrant_utm (too-old versions flagged), test a VM.
        platforms:
          - macos
        providers:
          - utm
        host: true
        tests:
          unit:
            - src-tauri/src/machine/setup/tests.rs > a_mac_with_docker_and_no_vagrant_sets_up_only_the_vm_path
            - src-tauri/src/runtime/providers.rs > an_old_utm_plugin_or_utm_reads_as_too_old_and_says_what_to_do
            - src-tauri/src/runtime/providers.rs > a_mac_is_offered_the_hypervisor_made_for_its_cpu_and_keeps_one_installed
            - src-tauri/src/machine/tools/scripts.rs > a_failed_cask_fetch_updates_homebrew_and_retries_once
          web:
            - "machine-setup.spec.ts > a fresh Mac: the package manager is detected, then each install streams"
          integration:
            - setup
          setup:
            - utm
            - vagrant
            - plugin:vagrant_utm
            - selftest:vm
        rig:
          - machine-setup@utm
          - docker-vm@utm
        gaps:
          web: dev mock only
          integration: "never run: the guided setup's paths can't run on the owner's Mac and a macOS guest has no nested Hypervisor.framework"

      - id: setup.path-vmware
        what: The VMware path - VMware Workstation/Fusion links out to the vendor; the setup then installs vagrant-vmware-desktop and the VMware Utility.
        providers:
          - vmware
        host: true
        tests:
          unit:
            - src-tauri/src/machine/setup/tests.rs > vmware_gets_its_plugin_and_hashicorps_utility_and_its_install_links_out
            - src-tauri/src/runtime/providers.rs > a_vmware_machine_without_the_plugin_or_the_utility_needs_both_and_is_ready_once_both_are_in
            - src-tauri/src/runtime/providers.rs > vmwares_desktop_hypervisor_is_named_for_the_os_and_nothing_else_is
            - src/features/machine/setup-steps/setup-steps.test.tsx > installs both of VMware
            - src/features/machine/setup-steps/setup-steps.test.tsx > reads VMware as set up once the plugin is in and the utility runs
