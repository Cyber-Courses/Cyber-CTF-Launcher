  - id: cleanup
    title: Maintenance and clean-up
    features:
      - id: cleanup.maintenance
        what: Settings > Maintenance gathers what still runs here, the lab downloads and the tools Cyber CTF installed, to clean them up.
        host: false
        pages:
          - settings:maintenance
        tests:
          unit:
            - src/features/settings/settings-interaction.test.tsx > shows the tools in the Maintenance section of the settings window
          web:
            - resilience.spec.ts > Settings and the setup windows at their minimum sizes
          desktop:
            - cleanup/section
        rig:
          - desktop-e2e
        gaps:
          web: only fits the section in a small window; no behaviour

      - id: cleanup.remove-downloads
        what: Clean up lab downloads (images, boxes, shared plugins) after a system confirmation; only what Cyber CTF itself downloaded is removed, and the panel says what it freed.
        providers:
          - docker
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
        commands:
          - machine_storage_clean
        tests:
          unit:
            - src-tauri/src/machine/storage.rs > clean_up_removes_only_the_apps_downloads_and_forgets_what_went
            - src-tauri/src/machine/storage.rs > a_removal_that_fails_says_why_the_item_stayed
            - src-tauri/src/machine/storage.rs > a_download_recorded_during_a_clean_up_is_kept
            - src-tauri/src/machine/storage/owned.rs > only_what_appeared_during_the_operation_is_claimed
            - src/features/machine/machine-interaction.test.tsx > asks once and removes once however often Clean up is pressed
            - src/features/machine/machine-screen.test.tsx > lists the downloads and frees space once the system dialog confirms it
          desktop:
            - cleanup/downloads-cancel
            - cleanup/downloads
          integration:
            - src-tauri/src/machine/storage.rs > real_docker_clean_up_keeps_the_players_image
        rig:
          - desktop-e2e
        gaps:
          web: no spec presses Clean up
          desktop: cleanup/downloads is skipped whenever the panel lists a download the run didn't make (usually the case on a used machine)
          integration: real removal is an opt-in Docker test outside the runner; removing Vagrant boxes never runs for real

      - id: cleanup.installed-tools
        what: List the tools Cyber CTF installed and remove one (winget, Homebrew, apt/pkexec, the VirtualBox uninstaller), after a system confirmation, with its log.
        host: true
        commands:
          - installed_tools
          - uninstall_dependency
        tests:
          unit:
            - src-tauri/src/machine/tools/uninstall.rs > only_a_tool_missing_before_and_found_after_counts_as_ours
            - src-tauri/src/machine/tools/uninstall.rs > a_removal_runs_as_root_as_an_install_does
            - src-tauri/src/machine/tools/uninstall.rs > every_windows_tool_is_removed_through_winget
            - src-tauri/src/machine/tools/uninstall.rs > every_macos_tool_has_a_way_out
            - src/features/settings/settings-rows.test.tsx > removes a tool only once the system dialog confirms it, then re-reads the list
            - src/features/settings/settings-interaction.test.tsx > streams the removal log, keeps every Remove off while it runs
          desktop:
            - cleanup/tool-remove
        rig:
          - desktop-e2e
        gaps:
          desktop: needs CYBERCTF_TEST_CLEANUP_TOOL and a tool the run's app installed; skips without it
          integration: no tier removes a tool on a real machine (the setup suite installs but never uninstalls)

      - id: cleanup.leaves-no-trace
        what: Labs stopped and removed leave nothing on the machine or server beyond what is kept by design (the download cache, a lab's persistent volumes, the app's own data); no container, network, volume, VM, process, listening port, temp file, credential, firewall rule or server object of a run stays.
        providers:
          - docker
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - parallels
          - proxmox
          - esxi
        host: true
        tests:
          unit:
            - tests/audit/inventory.test.ts
            - tests/audit/diff.test.ts
            - tests/audit/kinds.test.ts
        gaps:
          unit: the leftover audit's own logic (its parsers on recorded outputs, the diff, the allowlist, a run's scope on a shared machine); the audit itself is an entry point the rig runs around every suite (tests/leftovers.md), whose cells the rig's matrix has no column for yet

  - id: servers
    title: Servers
    features:
      - id: servers.list
        what: The Servers screen lists the saved Proxmox and ESXi hosts with their state, online count and how many labs run on each.
        providers:
          - proxmox
          - esxi
        host: false
        commands:
          - server_list
          - server_running_labs
        pages:
