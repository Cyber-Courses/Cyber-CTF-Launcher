          integration: never run (licence; the macOS lane installs nothing)

      - id: setup.path-full
        what: The full setup (docker+vm) - containers and VMs on the hypervisor the setup picks itself, then both self-tests and an example lab.
        providers:
          - docker
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
