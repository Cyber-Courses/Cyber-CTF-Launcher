            - src/features/servers/servers-screen.test.tsx > opens the setup window to edit a host or add one
            - src/features/servers/servers-screen.test.tsx > reloads and re-tests every host when the setup window saves one
            - src/features/servers/host-setup/host-setup.test.tsx > explores every server step on a fresh machine
