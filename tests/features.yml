            - src/features/labs/network-diagram/topology.test.ts
            - src/features/labs/network-diagram/layout.test.ts
            - src/features/labs/network-diagram/elk-engine.test.ts
            - src/features/labs/lab-detail/lab-state.test.ts > says why there is no diagram
          web:
            - labs.spec.ts > a running lab shows its network with the machines and the attack box
            - layout.spec.ts > a wide window gives a lab's diagram the page's width
            - a11y.spec.ts > a running lab's page, with its diagram, passes too
        gaps:
          desktop: no spec looks at the diagram

      - id: lab-page.fit-width
        what: A lab wider than its card says there is more, and fits to the width on request, remembered.
