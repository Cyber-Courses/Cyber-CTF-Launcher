            - src-tauri/src/machine/tools/scripts.rs > an_aws_cli_bundle_with_a_bad_signature_is_not_installed
            - src-tauri/src/machine/system.rs > azure_version_comes_from_az_version_json
            - src/features/servers/host-setup/cloud-setup.test.tsx > installs a missing cloud CLI and re-checks the machine
            - src/features/servers/host-setup/cloud-setup.test.tsx > logs a failed install and frees the buttons
        gaps:
          integration: no cloud CLI is ever installed for real

  - id: policy
    title: Administrators and networks
    features:
