          integration: prints_this_machines_report is opt-in and asserts nothing; the setup run's ready:<tool> lines are the only real check of the report, Debian 13 only so far
        note: Windows and macOS hosts never ran the check in any tier but unit; non-English OS output of the probes is untested.

      - id: machine.docker-engine-states
        what: See which container engines are installed and which one Docker uses, and why it can't run labs (stopped, no permission with the docker / docker-users group hint).
        providers:
          - docker
        host: true
        tests:
          unit:
            - src-tauri/src/machine/system/docker.rs > names_the_engine_from_the_daemon_and_the_context
            - src-tauri/src/machine/system/docker.rs > every_engine_is_listed_with_its_own_state_and_the_current_one_marked
            - src-tauri/src/machine/system/docker.rs > a_daemon_this_account_cannot_use_is_reported_without_waiting
            - src-tauri/src/platform/exec/docker.rs > a_denied_docker_socket_is_not_a_stopped_daemon
            - src-tauri/src/platform/exec/docker.rs > the_denied_message_names_the_command_to_run
            - src/features/machine/machine-screen.test.tsx > explains a denied or stopped current engine
          web:
            - "docker-engine.spec.ts > engine stopped: the Overview, the header, the Machine page and the labs say to start it"
            - docker-engine.spec.ts > engine denied (Linux)
            - "docker-engine.spec.ts > engine denied (Windows): the hint names the docker-users group"
          desktop:
            - machine/page
            - machine/guided-open
          setup:
            - ready:docker
        rig:
          - machine-setup
          - desktop-e2e
        gaps:
          desktop: a stopped engine is simulated with a dead DOCKER_HOST (guided-open); a denied socket (docker group not joined) is never reproduced on a real machine
          integration: no real run with several engines (OrbStack, Colima, Docker Desktop side by side) or a denied socket

      - id: machine.docker-engine-switch
        what: Start a stopped engine, or point Docker at another running engine, from the Machine page or the setup's engine step.
        platforms:
          - linux
          - macos
          - windows
        providers:
          - docker
        host: true
        commands:
          - docker_use_engine
          - docker_start_engine
        tests:
          unit:
            - src-tauri/src/machine/system/docker.rs > an_engine_is_started_docker_pointed_at_it_and_its_daemon_waited_for
            - src-tauri/src/machine/system/docker.rs > the_cli_is_pointed_at_the_context_of_the_engine_asked_for
            - src-tauri/src/machine/system/docker.rs > an_engine_that_cannot_be_started_here_is_refused
            - src/features/machine/machine-interaction.test.tsx > says a failed engine switch in a toast and re-checks the machine
            - src/features/machine/machine-interaction.test.tsx > starts the engine once however often Start is pressed while it starts
            - src/features/machine/setup-steps/setup-steps.test.tsx > starts a stopped engine, and offers its site when that fails
          web:
            - machine-providers.spec.ts > line up in columns, and the default moves without moving a name or a status
          setup:
            - engine:<id>
        rig:
          - machine-setup
        gaps:
          web: machine-providers.spec switches engines on the dev mock (machine=many); no web spec presses Start
          desktop: no spec starts or switches an engine
          integration: the setup run records engine:<id> only when its plan starts or switches one; a bare Debian plan installs Docker Engine and asks a new login instead, so neither command is known to have run for real; macOS multi-engine never run
          setup: the setup run records engine:<id> only when its plan starts or switches an engine; no run is known to have done either

      - id: machine.hypervisors
        what: See each local hypervisor installed, whether it can run VM labs and why not (no KVM, not in the group, plugin missing or too old), and make one the default from its row.
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/providers.rs > the_first_missing_layer_is_the_reason
            - src-tauri/src/runtime/providers.rs > kvm_problems_are_explained
            - src-tauri/src/runtime/providers.rs > a_provider_is_ready_exactly_when_nothing_is_needed
            - src-tauri/src/runtime/providers.rs > applicability_follows_the_os
            - src/features/machine/machine-screen.test.tsx > tests each hypervisor on its own, keeps its result on its row, and makes it the default from the row
            - src/features/machine/machine-screen.test.tsx > explains a blocked hypervisor
          web:
            - machine-providers.spec.ts > line up in columns, and the default moves without moving a name or a status
            - servers-cloud.spec.ts > shows its heading, its providers' avatars and its one action
            - servers-cloud.spec.ts > Machine's empty state offers a server instead
          desktop:
            - machine/page
            - machine/vm-test
          setup:
            - <hypervisor>
            - ready:<hypervisor>
        rig:
          - machine-setup
          - desktop-e2e
        gaps:
          desktop: a hypervisor row is only looked up to press Test (needs CYBERCTF_TEST_VM_PROVIDER; skips without it); its stated readiness is never compared with the machine
          integration: detection checked on a real machine only through the Debian setup run (libvirt); VirtualBox, QEMU, Hyper-V, UTM, VMware, Parallels detection never on a real host

      - id: machine.provider-rows
        what: Every engine and hypervisor installed is a row of one table on the Machine page, its status in the same words whichever is the default (Ready, Test failed, No permission, Stopped, Needs setup, Can't run here) with a tooltip saying what it means, the Default mark or Use by default in a slot of its own, then its action; making another one the default or opening a test moves no name, status or column, in every language.
        pages:
