        gaps:
          integration: no scenario runs a cloud-services lab in a real account

      - id: lab-run.server
        what: Start a lab on a saved Proxmox or ESXi server and stop it there (the lab-run side; adding the server is another area's).
        providers:
          - proxmox
          - esxi
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/vm_tests.rs > a_vm_lab_runs_on_an_esxi_host_through_the_runner
            - src-tauri/src/runtime/isothrum/vm_tests.rs > an_esxi_place_takes_the_hosts_settings_as_params_and_its_password_as_the_connection
            - src-tauri/src/runtime/isothrum/server.rs > the_servers_variables_are_params_and_its_secret_a_slot
            - src-tauri/src/runtime/isothrum/import/tests.rs > a_proxmox_lab_whose_files_predate_manifests_is_generated_then_taken_in_its_slot
            - src-tauri/src/runtime/status.rs > a_server_lab_says_where_it_runs
