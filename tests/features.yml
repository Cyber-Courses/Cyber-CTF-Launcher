          desktop: only the panel's title is checked; nothing is listed or stopped
          integration: the real stop is an opt-in Docker test outside the runner, not run by the rig; stopping a VM workload never runs for real

      - id: machine.downloads
        what: See what lab downloads (container images, VM boxes, shared Terraform plugins) Cyber CTF keeps on this machine and how much disk they take.
        providers:
          - docker
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
