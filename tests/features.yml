            - "cloud-labs.spec.ts > with a saved AWS account: the cost first"
        gaps:
          integration: Cost Explorer never asked by a test
        note: AWS only; the other clouds have no cost read.

      - id: cloud.cli-install
        what: Install a missing cloud CLI (AWS CLI with its signature checked, Azure CLI, gcloud) from the cloud setup, then re-check the machine.
        providers:
          - aws
          - azure
          - gcp
        host: true
        tests:
