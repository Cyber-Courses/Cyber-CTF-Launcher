  - id: setup
    title: Guided machine setup
    features:
      - id: setup.window
        what: The guided setup window - choose what to run (containers, VMs), walk that path's steps with Back/Continue, see the outcome; a step that crashes shows Try again inside the window.
        host: false
        pages:
          - route:/machine-setup
        tests:
          unit:
            - src/features/machine/machine-setup.test.tsx > each path lists only its own steps
            - src/features/machine/machine-setup.test.tsx > a reopened setup on a machine with Docker installed and tested starts past the Docker steps
            - src/features/machine/setup-steps/steps.test.ts
            - src/features/machine/setup-steps/step-status.test.ts
            - src/features/machine/step-boundary.test.tsx
            - src/features/machine/machine-interaction.test.tsx > holds Back and Continue while a self-test runs on its step
          web:
            - "machine-setup.spec.ts > a ready machine: each lab type's path starts where the machine stands"
            - resilience.spec.ts > Settings and the setup windows at their minimum sizes
          desktop:
            - machine/guided-open
            - machine/guided-path
        rig:
          - desktop-e2e
        gaps:
          desktop: opens the window and enters the container path's first step only; nothing is installed from the window on the real app

      - id: setup.add-provider
        what: Add a provider - pick an engine or hypervisor this machine can run but lacks, install it, test it, use it by default.
        host: true
        tests:
          unit:
            - src/features/machine/machine-setup.test.tsx > Add a provider lists what this Mac can run but doesn
            - src/features/machine/machine-setup.test.tsx > Add a provider says so when everything this machine can run is installed
            - src/features/machine/machine-setup.test.tsx > an engine installed from the picker stays listed
            - src/features/machine/machine-setup.test.tsx > a hypervisor installed from the picker asks for Vagrant and its plugin
          web:
            - servers-cloud.spec.ts > shows its heading, its providers' avatars and its one action
          desktop:
            - machine/add-provider
        rig:
          - desktop-e2e
        gaps:
          web: the empty state's Add a provider button is checked, not the picker's flow
          desktop: only checks the window says Add a provider

      - id: setup.package-manager
        what: The setup detects the package manager its installs use (Homebrew, winget, apt), gives the Homebrew command or App Installer link, and on a Linux without apt tells the player to install each tool themselves.
        host: true
        tests:
          unit:
            - src-tauri/src/machine/system.rs > the_package_manager_reports_its_first_version_line
            - src-tauri/src/machine/system.rs > a_package_manager_that_fails_its_version_is_not_installed
            - src-tauri/src/machine/setup/tests.rs > a_linux_without_apt_is_told_to_install_each_tool_itself_instead_of_a_failing_apt_command
            - src-tauri/src/machine/tools/install.rs > a_distribution_without_apt_is_told_to_install_it_itself_before_anything_runs
            - src/features/machine/setup-steps/setup-steps.test.tsx > links to App Installer on Windows and names the Linux package manager
            - src/features/machine/setup-steps/follows-the-plan.test.tsx > on a Linux without apt
          web:
            - "machine-setup.spec.ts > a fresh Mac: the package manager is detected"
          setup:
            - ready:<tool>
        rig:
          - machine-setup
        gaps:
          integration: real only on Debian (apt); Fedora/openSUSE/Arch bare runs (the 'install it yourself' path) prepared but not run; winget and Homebrew never on a bare machine
        note: "dnf, pacman and zypper are not supported: those distributions get the manual path by design."

      - id: setup.install-tool
        what: Install a tool in one click (Docker, Vagrant, Terraform, a hypervisor, a cloud CLI) through Homebrew, winget or pkexec+apt, with the OS password/UAC prompt, its log streamed, and the tool recorded as Cyber CTF's.
        host: true
        commands:
          - install_dependency
        tests:
          unit:
            - src-tauri/src/machine/tools/install.rs > an_install_streams_its_steps_and_records_a_tool_it_added
            - src-tauri/src/machine/tools/install.rs > linux_installs_through_pkexec
            - src-tauri/src/machine/tools/install.rs > windows_installs_through_winget_and_wsl_through_its_installer
            - src-tauri/src/machine/tools/steps.rs > pkexec_refusals_name_their_cause
            - src-tauri/src/machine/tools/exit_codes.rs > a_declined_uac_prompt_reads_as_cancelled
            - src-tauri/src/machine/tools/scripts.rs > vendor_keys_are_pinned_and_checked_before_apt_trusts_them
          web:
            - "machine-setup.spec.ts > a fresh Mac: the package manager is detected, then each install streams"
          desktop:
            - server-lab/tools
          integration:
            - setup
          setup:
            - docker
            - vagrant
            - <hypervisor>
        rig:
          - machine-setup
        gaps:
          desktop: server-lab/tools installs only what the server needs (Terraform, Vagrant), needs CYBERCTF_TEST_SERVER_ENV; skips without it
          integration: real installs on Debian 13 only; the rig answers the elevation itself (polkit rule, elevated scheduled task), so a real pkexec/UAC/Homebrew password prompt, a declined one, a proxy, offline or a non-English OS are never exercised

      - id: setup.vagrant
        what: Install Vagrant (HashiCorp's, not the distribution's) and the Vagrant plugin the chosen hypervisor needs, from the setup's provisioning step or Settings.
        providers:
          - libvirt
          - qemu
          - utm
          - vmware
          - parallels
          - hyperv
          - virtualbox
        host: true
        commands:
          - install_vagrant_plugin
        tests:
          unit:
            - src-tauri/src/machine/tools/install.rs > vagrant_comes_from_hashicorps_repository_not_the_distributions
            - src-tauri/src/machine/tools/install.rs > only_vagrant_plugin_names_are_installed
            - src-tauri/src/runtime/providers.rs > parses_vagrant_plugin_list
            - src/features/machine/setup-steps/setup-steps.test.tsx > installs Vagrant, then the hypervisor
            - src/features/machine/setup-steps/setup-steps.test.tsx > shows a failed plugin install, on its row too
            - src/features/settings/settings-rows.test.tsx > installs a missing Vagrant add-on, streaming its log, then re-checks
          web:
            - "machine-setup.spec.ts > a fresh Mac: the package manager is detected"
            - machine-setup.spec.ts > Fix opens the window at its step, a later Fix jumps there, and a failed install says why
          integration:
            - setup
          setup:
            - vagrant
            - plugin:<name>
            - ready:vagrant
        rig:
          - machine-setup
        gaps:
          integration: "real: vagrant + vagrant-libvirt on Debian 13 only; vagrant_utm, vagrant-qemu, vagrant-parallels, vagrant-vmware-desktop never installed by a test"

      - id: setup.vmware-utility
        what: Install HashiCorp's Vagrant VMware Utility (checked download and signature, elevated install), or reinstall it when its service stopped.
        platforms:
          - macos
          - windows
          - linux
        providers:
          - vmware
        host: true
        tests:
          unit:
            - src-tauri/src/machine/tools/vmware_utility.rs > the_mac_install_checks_hashicorps_file_and_signature_before_installing_as_root
            - src-tauri/src/machine/tools/vmware_utility.rs > the_windows_install_checks_hashicorps_file_and_signature_and_elevates_through_uac
            - src-tauri/src/machine/tools/vmware_utility.rs > a_download_that_isnt_hashicorps_file_fails_before_any_prompt
            - src-tauri/src/runtime/providers.rs > vmware_needs_the_utility_running_as_well_as_its_plugin
            - src/features/machine/setup-steps/setup-steps.test.tsx > a failed utility install reads as failed, not done, and the flow waits
            - src/features/machine/setup-steps/setup-steps.test.tsx > an installed utility whose service stopped is offered again
          setup:
            - vmware-utility
        rig:
          - machine-setup@vmware
        gaps:
          integration: "never run: VMware isn't installable on the rig (licence), so no setup run reaches vmware-utility"

      - id: setup.ovftool-place
        what: For ESXi, place VMware's OVF Tool from a folder the player picks (signature checked against VMware's team, quarantine lifted) and see the copy found.
        platforms:
          - macos
          - windows
          - linux
        providers:
          - esxi
        host: true
        commands:
          - ovftool_place
        tests:
          unit:
            - src-tauri/src/machine/tools/ovftool/tests.rs > a_signed_download_is_copied_into_the_apps_folder_and_the_download_left_as_it_was
            - src-tauri/src/machine/tools/ovftool/tests.rs > a_tool_signed_by_another_team_is_refused_with_that_team_and_nothing_is_placed
            - src-tauri/src/machine/tools/ovftool/tests.rs > a_placed_copy_is_reported_by_the_next_check
            - src-tauri/src/commands/machine.rs > placing_a_folder_without_the_ovf_tool_is_refused
            - src/features/servers/host-setup/ovftool-requirement.test.tsx
          web:
            - "setup-wizards.spec.ts > ESXi: the tools step waits for VMware"
          integration:
            - src-tauri/src/machine/tools/ovftool/tests.rs > real_download_is_placed_and_runs
        gaps:
          desktop: server-lab/tools fails when the OVF Tool is missing; it never places one
          integration: the real placement is an opt-in test outside the runner (macOS signature check), not run by the rig
        note: Offered in the server setup's tools step; the signature check is macOS-only.

      - id: setup.reboot-relogin
