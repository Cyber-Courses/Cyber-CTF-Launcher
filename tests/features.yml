          unit:
            - src/features/servers/host-setup/server-setup.test.tsx > installs Terraform for Proxmox
            - src/features/servers/host-setup/server-setup.test.tsx > needs Vagrant before the ESXi plugin, and links to the OVF Tool
            - src/features/servers/host-setup/server-setup.test.tsx > installs the ESXi plugin once Vagrant is there
            - src-tauri/src/runtime/server_selftest/esxi.rs > a_missing_plugin_or_ovftool_fails_up_front_before_the_host_is_reached
          web:
            - "setup-wizards.spec.ts > ESXi: the tools step waits for VMware"
          desktop:
            - server-lab/tools
        rig:
          - desktop-e2e
        gaps:
          desktop: needs CYBERCTF_TEST_SERVER_ENV; skips without it; can't place the OVF Tool

      - id: servers.test-connection
        what: Test a host (one or all) - reachability, sign-in, node, storage, bridge, SDN for Proxmox; SSH banner for ESXi - with a plain reason, a Needs password state and the macOS Local Network hint.
        providers:
          - proxmox
          - esxi
        host: true
        commands:
          - server_test
        tests:
          unit:
            - src-tauri/src/runtime/server/connection_test.rs > a_host_is_tested_by_its_provider_and_an_unsaved_one_is_an_error
            - src-tauri/src/runtime/server/reachability.rs > esxi_needs_an_ssh_banner
            - src-tauri/src/runtime/proxmox/tests.rs > sign_in_failures_say_what_to_fix
            - src-tauri/src/runtime/proxmox/tests.rs > the_sdn_check_finds_only_a_real_source_directive
            - src/features/servers/servers-screen.test.tsx > tests every host again with Test all, and one with its own Test
            - src/features/servers/servers-screen.test.tsx > points macOS players at the Local Network permission for a LAN host that fails
          web:
            - servers-cloud.spec.ts > Servers lists the hosts
          desktop:
            - server-lab/test
            - server-lab/listed
          integration:
            - src-tauri/src/runtime/proxmox/tests.rs > proxmox_live_test
        rig:
          - server:proxmox
          - desktop-e2e
        gaps:
          web: the mock answers online; only the count is checked
          integration: Proxmox only (opt-in proxmox_live_test, run by the rig as proxmox-connection); the ESXi connection test never runs for real outside the desktop spec

      - id: servers.vm-test
        what: Run a real VM test on a Proxmox or ESXi host (a small VM on its own network, upload progress, then torn down), from the setup window or the host's menu.
        providers:
          - proxmox
          - esxi
        host: true
        commands:
          - server_selftest
        tests:
          unit:
            - src-tauri/src/runtime/server_selftest/proxmox.rs > a_run_that_works_reports_every_step_and_tears_down
            - src-tauri/src/runtime/server_selftest/proxmox.rs > no_dhcp_on_the_uplink_fails_that_step_in_plain_words_and_still_tears_down
            - src-tauri/src/runtime/server_selftest/esxi.rs > a_run_that_works_reports_every_step_of_the_plan_and_tears_down
            - src-tauri/src/runtime/server_selftest/lab_run.rs > a_failed_teardown_says_what_its_course_says_is_left
            - src-tauri/src/commands/server.rs > the_vm_test_runs_on_proxmox_and_esxi_hosts_only
            - src/features/servers/host-setup/server-setup.test.tsx > runs a real test lab once the connection test passes
          desktop:
            - server-lab/vm-test
        rig:
          - desktop-e2e
        gaps:
          web: no spec runs the VM test
          desktop: needs CYBERCTF_TEST_SERVER_ENV; skips without it; desktop-e2e not run on the rig yet
          integration: no integration test runs server_selftest; the rig's server columns run labs through the runner instead

      - id: servers.remove
        what: Remove a host after a system confirmation; one with labs still on it is refused with the reason, and the default moves to another server.
        providers:
          - proxmox
          - esxi
        host: false
        commands:
          - server_remove
        tests:
          unit:
            - src-tauri/src/runtime/server/hosts/tests.rs > hosts_with_running_labs_are_not_removed
            - src-tauri/src/runtime/server/hosts/tests.rs > removing_the_default_hands_it_to_another_server
            - src-tauri/src/runtime/server/setup/tests.rs > a_host_whose_secret_cant_be_removed_stays_and_says_why
            - src/features/servers/servers-screen.test.tsx > removes a host only once the system dialog confirms it
            - src/features/servers/host-setup/host-wizard-interaction.test.tsx > leaves a server with a running lab listed
          desktop:
            - server-lab/remove
        rig:
          - desktop-e2e
        gaps:
          desktop: needs CYBERCTF_TEST_SERVER_ENV; skips without it

      - id: servers.default
        what: Make a server the default place labs start (or unset it); a cloud account can't be the default.
        providers:
          - proxmox
          - esxi
        host: false
        commands:
          - server_set_default
        tests:
          unit:
            - src-tauri/src/runtime/server/hosts/tests.rs > only_a_saved_server_can_be_the_default
            - src-tauri/src/runtime/server/hosts/tests.rs > the_first_server_saved_becomes_the_default_but_never_a_cloud
            - src-tauri/src/runtime/server/contract.rs > the_default_host_is_a_saved_server_never_a_cloud
            - src/features/servers/servers-screen.test.tsx > toggles the default host
            - src/features/servers/servers-screen.test.tsx > shows why setting the default failed

      - id: servers.capacity
        what: See a Proxmox server's free CPU, memory and storage on the Servers screen.
        providers:
          - proxmox
        host: true
        commands:
          - server_capacity
        tests:
          unit:
            - src-tauri/src/runtime/server/capacity.rs > capacity_needs_every_figure
            - src-tauri/src/runtime/server/capacity.rs > only_a_saved_proxmox_server_reports_its_capacity_and_a_failed_read_says_why
            - src/features/servers/servers-screen.test.tsx > hides the capacity panel when no host reports its capacity
            - src/features/servers/servers-screen.test.tsx > keeps the page up when the capacity read or running count fails
        gaps:
          integration: never read from a real Proxmox

      - id: servers.secrets
        what: Host and account secrets (passwords, tokens, keys) live in the OS keychain; a blank password on edit keeps the stored one, and a missing or unreadable secret is said, never read as none.
        providers:
          - proxmox
          - esxi
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/server/secrets.rs > a_keychain_that_cant_be_read_says_so_and_never_reads_as_no_secret
            - src-tauri/src/runtime/server/secrets.rs > a_missing_secret_says_to_enter_one
            - src-tauri/src/platform/keychain.rs > only_a_missing_entry_reads_as_none_and_a_failure_says_what_to_do
            - src-tauri/src/runtime/server/setup/tests.rs > a_blank_password_keeps_the_stored_one_asks_for_a_missing_one_and_says_why_one_cant_be_read
            - src/features/servers/servers-screen.test.tsx > asks for a password instead of calling a host without one down
            - src/features/servers/host-setup/host-wizard-interaction.test.tsx > saves an edited server without a password, so the core keeps the one in the keychain
        gaps:
          desktop: test builds use the dev secrets file; the real OS keychain (macOS Keychain, Windows Credential Manager, Secret Service) is never exercised by any tier

  - id: cloud
    title: Cloud accounts
    features:
      - id: cloud.accounts
        what: The Cloud screen lists the connected cloud accounts (with the labs running on them), offers the providers not yet connected, and removes an account after a confirmation.
        providers:
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: false
        pages:
          - tab:cloud
        tests:
          unit:
            - src/features/cloud/cloud-screen.test.tsx > lists only the cloud accounts, and offers the providers not connected apart from them
            - src/features/cloud/cloud-screen.test.tsx > removes an account only once the system dialog confirms it
            - src/features/cloud/cloud-screen.test.tsx > opens the cloud setup to edit an account, connect another on its own provider, or set one up
            - src/features/cloud/cloud-model.test.ts > keeps the cloud accounts among the saved hosts
            - src/features/servers/servers-model.test.ts > leaves the AWS, Azure and GCP accounts to the Cloud page
            - src/features/servers/host-setup/host-wizard-interaction.test.tsx > leaves a cloud account with a running lab listed
          web:
            - servers-cloud.spec.ts > Cloud lists the accounts
            - servers-cloud.spec.ts > Set up cloud provider opens the cloud setup
          desktop:
            - setup-screens
        rig:
          - desktop-e2e
        gaps:
          desktop: setup-screens only renders the Cloud screen and its Set up cloud provider button

      - id: cloud.aws-cli
        what: Connect AWS through the AWS CLI - pick a profile, see who it signs in as, or sign in in the browser (aws login, CLI 2.32+).
        providers:
          - aws
        host: true
        commands:
          - aws_profiles
          - aws_cli_identity
          - aws_login
        tests:
          unit:
            - src-tauri/src/cloud.rs > a_profile_is_passed_only_when_chosen
            - src-tauri/src/cloud.rs > a_profile_reaches_the_cli_as_one_argument_however_it_is_spelled
            - src-tauri/src/cloud.rs > the_cloud_commands_read_their_clis
            - src/features/servers/host-setup/cloud-setup.test.tsx > keeps the identity of the profile picked last when reads answer out of order
            - src/features/servers/host-setup/cloud-setup.test.tsx > signs in with the browser and logs who it signed in as
            - src/features/servers/host-setup/cloud-setup.test.tsx > says an AWS CLI older than 2.32 has no browser sign-in
          web:
            - "setup-wizards.spec.ts > AWS with the CLI: Back keeps the region and the name, then it connects"
            - setup-wizards.spec.ts > the AWS CLI profile menu lists each profile once
        gaps:
          integration: no test reads profiles or signs in with a real AWS CLI; cloud excluded from the rig for now

      - id: cloud.aws-access-keys
        what: Connect AWS with access keys (key id checked, temporary keys steered to the CLI), stored in the keychain.
        providers:
          - aws
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/server/input.rs > aws_regions_and_keys
            - src-tauri/src/runtime/server/input.rs > check_steers_temporary_aws_keys_to_cli_mode
            - src-tauri/src/runtime/server/contract.rs > aws_terraform_env_uses_keys_or_cli_profile
            - "src/features/servers/host-setup/cloud-setup.test.tsx > edits an account with access keys: region, budget, save and test"
          web:
            - "setup-wizards.spec.ts > AWS with access keys: both are needed, and a wrong key id is refused with the reason"
        gaps:
          integration: never against a real account

      - id: cloud.cli-sign-in
        what: Sign in to Azure or Google Cloud with its CLI in the browser from the cloud setup, with its log, and cancel it.
        providers:
          - azure
          - gcp
        host: true
        commands:
          - cloud_login
          - cloud_login_cancel
        tests:
          unit:
            - src-tauri/src/cloud.rs > each_cloud_signs_in_with_its_own_cli
            - src-tauri/src/cloud.rs > a_sign_in_can_be_cancelled_and_never_waits_forever
            - src-tauri/src/runtime/server/sign_in.rs > each_cloud_that_signs_in_through_its_cli_has_one_question
            - src/features/servers/host-setup/cloud-setup.test.tsx > cancelled, hides its log and says it was cancelled
            - src/features/servers/host-setup/cloud-setup.test.tsx > failed, keeps its log and says why
        gaps:
          integration: never with a real az/gcloud and browser

      - id: cloud.azure
        what: Connect Azure - pick a subscription and location from the CLI (or paste an id); the account test checks the lab VM size is offered and has quota there.
        providers:
          - azure
        host: true
        commands:
          - azure_subscriptions
        tests:
          unit:
            - src-tauri/src/cloud.rs > azure_subscriptions_parse_or_are_none
            - src-tauri/src/runtime/server/input.rs > azure_location_and_subscription
            - src-tauri/src/runtime/server/azure_size/tests.rs > a_size_refused_to_the_subscription_says_so_and_where_it_isnt
            - src-tauri/src/runtime/server/azure_size/tests.rs > the_quota_says_how_many_cores_are_free_and_never_names_another_region
            - src/features/servers/host-setup/cloud-setup.test.tsx > picks the default subscription and a location
            - src/features/servers/host-setup/cloud-setup.test.tsx > offers the CLI sign-in when no subscription is visible, then lists them
        gaps:
          integration: never against a real subscription

      - id: cloud.gcp
        what: Connect Google Cloud - the signed-in account, a billing account and organization from gcloud; the launcher makes its labs project under them.
        providers:
          - gcp
        host: true
        commands:
          - gcp_account
          - gcp_billing_accounts
          - gcp_organizations
        tests:
          unit:
            - src-tauri/src/cloud.rs > gcp_lists_drop_prefixes_and_nameless_entries
            - src-tauri/src/cloud.rs > an_expired_application_default_sign_in_reads_as_signed_out
            - src-tauri/src/runtime/server/gcp.rs > the_labs_project_is_created_under_the_organization_when_set
            - src-tauri/src/runtime/server/gcp.rs > a_project_whose_setup_failed_is_deleted_never_saved_half_set_up
            - src/features/servers/host-setup/cloud-setup.test.tsx > defaults to the first open billing account and sets the organization
            - src/features/servers/host-setup/cloud-setup.test.tsx > takes a typed billing id when the account lists none
        gaps:
          integration: never against a real Google Cloud account

      - id: cloud.oci
        what: Connect Oracle Cloud, prefilled from ~/.oci/config.
        providers:
          - oci
        host: true
        commands:
          - oci_config
        tests:
          unit:
            - src-tauri/src/cloud.rs > the_oci_config_is_read_from_its_default_profile
            - src-tauri/src/cloud.rs > oci_config_lines_at_the_edges
            - src-tauri/src/runtime/server/input.rs > oci_region_and_ocid
            - src-tauri/src/runtime/server/cloud_checks.rs > oci_outcomes_and_a_missing_cli_only_warns
            - src/features/servers/host-setup/cloud-setup.test.tsx > prefills Oracle Cloud from ~/.oci/config
            - src/features/servers/host-setup/cloud-setup.test.tsx > says when there is no ~/.oci/config
        gaps:
          integration: never against a real tenancy

      - id: cloud.token-clouds
        what: Connect DigitalOcean or Linode with an API token (kept on edit), and pick a region.
        providers:
          - digitalocean
          - linode
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/server/input.rs > digitalocean_linode_regions_and_tokens
            - src-tauri/src/runtime/server/cloud_checks.rs > token_api_outcomes
            - src-tauri/src/runtime/server/contract.rs > token_cloud_terraform_env_passes_the_token
            - src/features/servers/host-setup/host-wizard-interaction.test.tsx > needs a DigitalOcean token before Continue
            - src/features/servers/host-setup/host-wizard-interaction.test.tsx > lets an edited token account keep its token, and saves no new one
        gaps:
          integration: never against a real account

      - id: cloud.test-account
        what: Test a cloud account - CLI or keys signed in, Terraform there, launch permission (AWS dry run), project/subscription/size checks - each check shown with its reason.
        providers:
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/server/cloud_checks.rs > aws_credentials_pass_with_the_arn
            - src-tauri/src/runtime/server/cloud_checks.rs > a_denied_dry_run_fails_the_checklist_with_the_identity
            - src-tauri/src/runtime/server/cloud_checks.rs > the_gcp_test_asks_for_the_sign_in_a_launch_needs_first
            - src-tauri/src/runtime/server/connection_test.rs > a_gcp_account_whose_labs_project_cant_be_had_says_that_not_its_sign_in
            - src/features/cloud/cloud-screen.test.tsx > tests an account and shows each check
            - src/features/servers/host-setup/cloud-setup.test.tsx > marks a connection test that passed as passed
          web:
            - "setup-wizards.spec.ts > AWS with the CLI: Back keeps the region and the name, then it connects"
          integration:
            - src-tauri/src/runtime/server/cloud_checks.rs > the_real_aws_account_test_confirms_the_launch_permission
        gaps:
          web: AWS only, against the mock
          integration: AWS only, opt-in outside the runner; Azure, GCP, OCI, DigitalOcean, Linode checks never against a real account; cloud excluded from the rig

      - id: cloud.budget-spend
        what: See an AWS account's month-to-date spend against its budget on the Cloud screen and in the setup (the same figure the launch budget gate checks).
        providers:
          - aws
        host: true
        commands:
          - server_month_to_date_cost
          - aws_month_to_date_cost
        tests:
          unit:
            - src-tauri/src/runtime/server/budget.rs > an_accounts_spend_is_read_with_its_own_keys_not_the_clis_default
            - src-tauri/src/runtime/server/budget.rs > an_account_that_cant_be_read_is_unverifiable_never_under_budget
            - src-tauri/src/runtime/server/budget.rs > the_verdict_blocks_only_a_readable_spend_over_the_limit
            - src-tauri/src/cloud.rs > a_profiles_spend_is_read_with_that_profile
            - src/features/cloud/cloud-screen.test.tsx > counts the accounts over budget
            - src/features/servers/host-setup/cloud-setup.test.tsx > reads the CLI identity and spend per profile, and warns at the budget
