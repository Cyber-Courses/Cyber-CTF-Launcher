          - linux
        host: true
        commands:
          - machine_restart
        tests:
          unit:
            - src-tauri/src/machine/system/wsl.rs > a_restart_is_scheduled_once_whoever_asks
            - src-tauri/src/machine/system/wsl.rs > a_failed_restart_takes_back_what_it_wrote_and_can_be_tried_again
            - src-tauri/src/machine/system/wsl.rs > the_app_reopens_by_its_path_or_its_store_package
            - src-tauri/src/machine/system/wsl.rs > restarting_is_refused_off_windows_and_the_check_has_no_wsl
            - src-tauri/src/machine/setup/tests.rs > a_docker_daemon_refusing_this_account_asks_for_a_new_login_last
            - src/features/machine/setup-steps/setup-steps.test.tsx > restarts only after the player confirms in the system dialog
          integration:
            - setup
        rig:
          - machine-setup
        gaps:
          integration: "the setup run ends its pass at a Restart/Relogin and the rig restarts or logs in itself: machine_restart (shutdown, RunOnce, app reopening) never runs for real; Windows rows not run yet"

      - id: setup.wsl
        what: On Windows, the setup turns WSL 2 on (or says virtualization is off in the firmware), then asks for the restart it needs.
