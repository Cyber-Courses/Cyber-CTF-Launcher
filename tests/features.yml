          desktop: only the desktop/headless choice is saved to storage; image choice not driven
        note: What the attack box does with these is the attack-box features'.

      - id: settings.shared-folder-row
        what: In Settings > Labs, turn the folder shared with the attack box on and pick it with the system folder picker, shown with its mount point.
        host: true
        tests:
          unit:
            - src/features/settings/settings-rows.test.tsx > turns sharing on, showing the folder and its mount point
            - src/features/settings/settings-rows.test.tsx > changes the folder from the picker, and keeps it when the picker is cancelled
            - src/features/settings/settings-interaction.test.tsx > says why the folder picker couldn't open
          web:
            - settings.spec.ts > the shared-folder switch is there and toggles
          desktop:
            - settings/shared-folder
        rig:
          - desktop-e2e
        note: Whether the box sees the folder is the attack box's feature.

      - id: settings.hypervisor-preference
        what: In Settings > Labs, pick which ready hypervisor VM labs use (or Automatic), install a missing Vagrant add-on with its log, or let this Windows account manage Hyper-V.
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
        tests:
          unit:
            - src/features/settings/settings-rows.test.tsx > picks a hypervisor among several, and goes back to automatic
            - src/features/settings/settings-rows.test.tsx > falls back to automatic when the saved hypervisor is no longer ready
            - src/features/settings/settings-rows.test.tsx > installs a missing Vagrant add-on, streaming its log, then re-checks
            - src/features/settings/settings-rows.test.tsx > lets a Windows account that may not manage Hyper-V join Hyper-V Administrators
            - src/features/settings/settings-screen.test.tsx > re-checks the machine after a hypervisor add-on install
            - src/lib/lib-behavior.test.tsx > follows a change made in this window and one made in another
          setup:
            - plugin:<name>
        rig:
          - machine-setup
        gaps:
          web: no spec opens the hypervisor row
          setup: the headless setup installs plugins through the same core code, not through this row

      - id: settings.about
        what: Settings > About shows the app version, this system and the install id, saying why one couldn't be read.
        host: false
        pages:
          - settings:about
        tests:
          unit:
            - src/features/settings/settings-rows.test.tsx > shows the version, the system and the install id
            - src/features/settings/settings-rows.test.tsx > shows a placeholder without a version, report or agent
            - src/features/settings/settings-screen.test.tsx > says why the version, the machine check and the agent couldn't be read
          web:
            - a11y.spec.ts > the Settings window passes too
        gaps:
          web: only rendered for axe; nothing checks the version shown

      - id: settings.managed-by-organization
        what: An administrator's policy (registry, managed preferences, /etc JSON) can turn off the website agent, the updater, tool installs, cloud launches and privileged labs; Settings lists what is managed.
        host: true
        commands:
          - managed_settings
        tests:
          unit:
            - src-tauri/src/platform/policy.rs
            - src-tauri/src/commands/app.rs > the_managed_settings_carry_the_policy_and_the_update_channel
            - src/features/settings/settings-rows.test.tsx > lists what the policy turns off, each with its setting
            - src/features/settings/settings-rows.test.tsx > offers no add-on install the policy turns off
            - src-tauri/src/account/agent/registration.rs > the_policy_keeps_the_agent_off
            - src-tauri/src/platform/config.rs > only_a_debug_build_reads_endpoints_from_its_environment
          web:
            - a11y.spec.ts > the Settings window, with what an administrator manages, passes too
        gaps:
          web: only rendered for axe
          desktop: no spec runs the app under a policy; the desktop runs use a debug (wdio) build, where endpoint overrides are on
          integration: the real registry, managed-preferences and Linux policy file are never read on a host (only a test override)
        note: Also holds the release build's locked service endpoints (platform/config.rs), the other corporate control.

