  - id: install
    title: Install, upgrade, uninstall
    features:
      - id: install.installer
        what: Install the app from its package (.deb, AppImage, .app/.dmg, NSIS, MSI, MSIX, Homebrew cask) and launch it.
        host: true
        tests:
          package:
            - .github/workflows/package-smoke.yml
            - packaging/windows/smoke-test.ps1
        rig:
          - package
        gaps:
          unit: "nothing to unit-test: the bundle's layout and installers"
          package: package-smoke.yml installs and launches the .deb, the .app, NSIS and MSI for 15 s only; the AppImage, the .dmg, MSIX and the Homebrew cask are never installed by a test; smoke-test.ps1 (paths with spaces and accents, NSIS edge cases) is run by hand

      - id: install.upgrade
        what: Install a newer version over an older one, keeping settings, labs, the session and saved servers (data moved where needed, e.g. out of MSIX's virtualised folders).
        host: true
        tests:
          unit:
            - src-tauri/src/platform/msix_data.rs
        gaps:
          unit: only MSIX's data move; no test reads an older version's files (settings, imported labs, servers, session) with the new one
          package: no test installs version N and then N+1

      - id: install.uninstall
        what: Uninstall the app, leaving the player's data, and removing a self-test Hyper-V VM left running.
        platforms:
          - linux
          - macos
          - windows
        host: true
        tests:
          package:
            - .github/workflows/package-smoke.yml > msiexec-remove
        gaps:
          unit: the NSIS hook's script (packaging/windows/remove-test-vm.ps1) has no test
          package: only the MSI is removed (msiexec /x) and only its exit code is checked; NSIS, .deb and the leftover self-test VM are never checked

  - id: resilience
    title: What a player does that breaks a lab
    features:
      - id: resilience.machine-removed
        what: "A container removed outside the app (docker rm -f) while its lab runs or starts: the lab page shows it gone with its health banner, a resume is refused naming it, a failed start says Docker's words, and a reset or a start again brings the whole lab back, nothing left (tests/resilience.md M1, M2)."
        host: true
        providers:
          - docker
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/tests.rs > a_machine_removed_while_the_lab_runs_is_shown_down_not_left_out
            - src-tauri/src/runtime/isothrum/errors.rs > a_resume_with_machines_removed_outside_names_them_and_says_to_start_again
            - src/features/labs/network-diagram/diagram.test.tsx > shows each machine's state in words
          integration:
            - resilience-docker-removed
            - resilience-docker-removed-starting
        gaps:
          desktop: no spec removes a container under the real app and reads the health banner
        note: Isothrum's own fake-engine and property tests (run/tests/disruptions*) hold the runner's side.

      - id: resilience.machine-stopped
        what: "A container stopped (docker stop) or a VM powered off outside the app while its lab runs: shown down, and a resume brings it back (tests/resilience.md M4, M6)."
        host: true
        providers:
          - docker
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
        tests:
          integration:
            - resilience-docker-stopped
            - resilience-vm-powered-off
        gaps:
          unit: the launcher's own view of a stopped machine is the diagram's state words alone
          integration: resilience-vm-powered-off powers off through Vagrant (halt --force), not each hypervisor's own Power Off
        note: The lab page offers the resume (its repair control) to VM labs only; a Docker lab with a stopped container gets Reset.

      - id: resilience.vm-destroyed
        what: "A VM destroyed outside the app (vagrant destroy, the hypervisor's Delete) while its lab runs: shown gone, a resume refused without making it again unprovisioned, and a start again rebuilds the lab (tests/resilience.md M5)."
        host: true
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
        tests:
          integration:
            - resilience-vm-destroyed
        gaps:
          integration: "needs a hypervisor: run by the rig, never in CI"
        note: Isothrum's driver/vagrant/tests/disruptions.rs holds the refusal with its fake Vagrant.

      - id: resilience.vm-killed-provisioning
        what: "A VM killed by its hypervisor while vagrant up provisions it: the start fails in Vagrant's words (or finishes whole), and a start again works with no tool left running (tests/resilience.md M7)."
        host: true
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
        tests:
          integration:
            - resilience-vm-killed-provisioning
        gaps:
          integration: throwaway machines only (CYBERCTF_TEST_RESILIENCE_THROWAWAY, CYBERCTF_TEST_RESILIENCE_VM_KILL)

      - id: resilience.killed-start
        what: "The deploy worker (or the process running the start) killed mid-start: the start says it stopped without a result, the lab reads as failed, not running, its launch token is removed, and a Stop then a start bring it back (tests/resilience.md A3)."
        host: true
        tests:
          unit:
            - src-tauri/src/app/deploy_worker/files.rs > a_launch_whose_worker_was_killed_is_a_failed_launch_and_its_token_is_removed
            - src-tauri/src/app/deploy_worker/files.rs > a_killed_pause_is_its_own_failure_not_the_labs_launch
            - src-tauri/src/app/deploy_worker/files.rs > a_job_still_being_started_or_one_that_ended_is_not_lost
            - src-tauri/src/app/operations.rs > a_stale_pidfile_lists_no_operation_and_is_swept
          integration:
            - resilience-docker-killed-start
            - resilience-vm-killed-start
          desktop:
            - kill-worker
        gaps:
          desktop: kill-worker kills with SIGKILL, so it skips on Windows
          integration: the tools a killed start ran outlive it (their own process groups); the scenarios wait for them, nothing ends them (tests/resilience.md A4)

      - id: resilience.window-closed-mid-start
        what: "The window closed while a lab starts: the start goes on in its worker, and the reopened app shows the lab running (tests/resilience.md A1)."
        host: true
        tests:
          desktop:
            - close-mid-deploy
        gaps:
          unit: covered by the deploy worker's design only (it is no child of the window)

      - id: resilience.double-start
        what: "Start pressed twice: one start runs, the other is refused as already in progress, one copy of the lab (tests/resilience.md S1)."
        host: true
        tests:
          unit:
            - src-tauri/src/app/deploy_worker/process.rs > a_second_start_is_refused_while_the_first_worker_runs
          desktop:
            - double-start

      - id: resilience.stop-during-start
        what: "Stop pressed while the lab starts: the start ends, the lab is taken down and reads as stopped, nothing left, and a start again works (tests/resilience.md S2)."
        host: true
        tests:
          unit:
            - src-tauri/src/app/deploy_worker.rs > nothing_starts_on_a_lab_while_it_stops
          desktop:
            - stop-during-start

      - id: resilience.docker-stopped
        what: "Docker quit or stopped while a lab starts: the start says Docker isn't running, and a start once it is back works (tests/resilience.md T1)."
        host: true
        providers:
          - docker
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/errors.rs > docker_stopped_while_a_step_ran_reads_as_a_stopped_engine_on_this_machine_only
          integration:
            - resilience-docker-daemon-stopped
        gaps:
          integration: throwaway machines only (CYBERCTF_TEST_RESILIENCE_THROWAWAY, the OS's stop and start commands as knobs)

      - id: resilience.files-deleted
        what: "The lab's generated files deleted while it runs: made again, so its page still sees it and its Stop takes it down; with its whole folder gone, the Stop says what may still run (tests/resilience.md F1, F2)."
        host: false
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/tests.rs > a_running_labs_files_deleted_are_made_again_so_its_page_and_its_stop_still_reach_it
            - src-tauri/src/runtime/isothrum/tests.rs > a_running_lab_whose_whole_folder_is_gone_says_what_is_left
        gaps:
          integration: no scenario deletes a running lab's files on the real engine

      - id: resilience.port-taken
        what: "A port the lab publishes held by another process at start: refused naming the port, nothing started, and a start once it is free works (tests/resilience.md N3)."
        host: true
        providers:
          - docker
        tests:
          integration:
            - resilience-docker-port-taken

known_gaps:
  - id: shared-folder-off-docker-and-libvirt
    what: The shared folder is untested on Hyper-V, QEMU on macOS, Proxmox and ESXi (and the clouds)
    status: "not mounted there by design: the deploy log says so, and no test checks even that; green only on Docker and libvirt (debian-13)"
    features:
      - attack-box.shared-folder
      - providers.hyperv
      - providers.qemu
      - lab-run.server

  - id: path-edge-cases
    what: Paths with spaces, accents or another owner (the lab folder, the shared folder, the app's data) are unit-tested only
    status: quotes, spaces and $ in the shared folder's path have unit tests; accented paths, odd lab-folder names and the box's uid mapping have none; smoke-test.ps1 installs into an accented path by hand
    features:
      - attack-box.shared-folder
      - attack-box.player-account
      - imports.import-folder
      - install.installer

  - id: upgrade-migration
    what: "Upgrading from an older version: no test reads an older version's settings, labs, servers or session"
    status: only the MSIX data move is unit-tested
    features:
      - install.upgrade
      - updates.in-app-update

  - id: installer-uninstall
    what: "Installers and uninstall: the AppImage, the .dmg, MSIX and the Homebrew cask are never installed by a test; only the MSI is removed"
    status: package-smoke.yml installs and launches .deb, .app, NSIS and MSI for 15 s; the rig's package cell passed on debian-13 only
    features:
      - install.installer
      - install.uninstall

  - id: hostile-environments
    what: "Hostile environments: no tier runs behind a proxy, offline, as a non-administrator or on a non-English OS"
    status: the rig answers elevation itself (a polkit rule, an elevated scheduled task), so a declined or real prompt never happens in a test
    features:
      - policy.proxy
      - setup.install-tool
      - setup.package-manager
      - catalogue.unreachable
      - i18n.translated-errors

  - id: catalogue-suite
    what: "The lab catalogue suite: no suite starts every catalogue lab, in each of its forms, through the launcher"
    status: planned; corpus-docker runs your own lab folders on Docker only, and no integration test downloads a lab from the catalogue
    features:
      - catalogue.download-install
      - catalogue.update-installed-lab
      - lab-run.container
      - lab-run.vm

  - id: resilience-suite
    what: "The resilience suite: a deploy killed, the app quit, the network or Docker lost mid-operation"
    status: "the resilience area (tests/resilience.md) covers machines removed, stopped or killed, the worker killed, a double Start, Stop during Start, Docker stopped and deleted files; sleep, reboot, a full disk, a clock jump, the network cut and a server's credentials changed are rig proposals, not tests yet"
    features:
      - lab-run.interrupted-deploy-recovery
      - app.quit-guard
      - lab-run.failures-and-retry
