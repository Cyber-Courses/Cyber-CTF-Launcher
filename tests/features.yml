            - src/features/machine/machine-screen.test.tsx > lists every hypervisor installed, each with its own state
            - src/features/machine/machine-screen.test.tsx > marks the hypervisor chosen in Settings, not the first installed one
          web:
            - machine-providers.spec.ts > line up in columns, and the default moves without moving a name or a status
            - machine-providers.spec.ts > opening a row's test keeps every column where it was
            - machine-providers.spec.ts > each status says what it means in a tooltip, on hover and on keyboard focus
            - a11y.spec.ts > the Machine screen with several providers of each kind passes too
        gaps:
