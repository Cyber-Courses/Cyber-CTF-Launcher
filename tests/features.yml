        what: An administrator's policy (registry, managed plist, /etc/cyberctf/policy.json) turns one-click tool installs and removals off; the app offers none and says why.
        host: true
        tests:
          unit:
            - src-tauri/src/platform/policy.rs > a_switch_that_is_on_refuses_with_its_name
            - src-tauri/src/platform/policy.rs > a_policy_that_cannot_be_read_turns_every_switch_on
            - src-tauri/src/machine/tools/install.rs > the_policy_refuses_every_one_click_install_before_anything_runs
            - src-tauri/src/machine/tools/uninstall.rs > the_policy_refuses_a_removal_before_anything_runs
            - src/features/machine/setup-steps/setup-steps.test.tsx > offers no one-click install the policy turns off, and says why
            - src/features/settings/settings-rows.test.tsx > offers no removal the policy turns off, and says why
        gaps:
          integration: no tier sets a real policy on a machine (registry key, MDM profile, policy.json)

      - id: policy.proxy
        what: Tools the app starts (docker, vagrant, terraform, apt via pkexec, the cloud CLIs) get the corporate proxy - from the environment, or the macOS system proxy.
        platforms:
          - linux
          - macos
        host: true
        tests:
          unit:
            - src-tauri/src/platform/proxy.rs > the_system_proxy_becomes_the_tools_variables
            - src-tauri/src/platform/proxy.rs > root_commands_get_the_proxy_variables_that_are_set
            - src-tauri/src/platform/proxy.rs > a_disabled_proxy_or_a_pac_file_sets_nothing
            - src-tauri/src/machine/tools/install.rs > a_root_install_carries_the_proxy_through_pkexec
        gaps:
          integration: no run behind a proxy (setup, installs, labs); PAC files are logged, not followed
        note: Windows relies on each tool's own proxy settings; nothing in the app handles it there.

