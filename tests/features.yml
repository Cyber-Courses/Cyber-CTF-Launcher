            - src-tauri/src/machine/system/wsl.rs > virtualization_off_in_the_firmware_never_loops_on_restarts
            - src-tauri/src/machine/setup/tests.rs > windows_restarts_for_wsl_last_and_installs_everything_else_first
            - src-tauri/src/machine/setup/tests.rs > a_running_docker_engine_is_proof_enough_of_wsl
            - src/features/machine/setup-steps/setup-steps.test.tsx > turns on WSL, then asks for a restart
            - src/features/machine/setup-steps/follows-the-plan.test.tsx > turns WSL 2 on on a bare Windows
          integration:
            - setup
          setup:
            - wsl
            - ready:wsl
        rig:
          - machine-setup
        gaps:
          integration: Windows 11 setup rows not run yet; the probes' parsing of non-English Windows output untested

      - id: setup.path-docker
        what: The container path - turn WSL 2 on (Windows), install the recommended engine (Docker Desktop, or Docker Engine from Docker's apt repository on Linux) or start/switch one, then test it.
