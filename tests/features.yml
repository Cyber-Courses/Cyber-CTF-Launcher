      - id: providers.virtualbox
        what: VM-form labs on VirtualBox (and its RDP screen).
        providers:
          - virtualbox
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/providers.rs > virtualbox_reads_as_not_responding_only_when_the_apps_timeout_cut_it_short
            - src-tauri/src/runtime/discover.rs > vbox_listings_skip_lines_that_are_not_a_quoted_name
            - src-tauri/src/runtime/isothrum/vm_tests.rs > a_vm_labs_hypervisor_is_read_from_its_record_without_vagrant
          desktop:
