            - src-tauri/src/runtime/isothrum/tests.rs > a_parked_lab_whose_containers_are_gone_offers_a_fresh_start
            - src-tauri/src/runtime/lifecycle.rs > a_lab_is_parked_only_in_a_mode_its_page_is_offered
            - src-tauri/src/runtime/lifecycle.rs > a_pause_of_containers_on_docker_is_refused_before_anything_runs
            - src-tauri/src/runtime/lifecycle.rs > a_cloud_lab_is_never_parked
            - src/features/labs/use-lab-actions.test.tsx > pauses and shuts down a lab
