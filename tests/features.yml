            - src-tauri/src/machine/tools/scripts.rs > libvirt_install_brings_what_the_vagrant_libvirt_plugin_compiles_against
            - src-tauri/src/machine/tools/scripts.rs > libvirt_install_brings_virtiofsd_for_the_shared_folder_where_the_release_has_it
