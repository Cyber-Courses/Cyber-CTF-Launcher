        rig:
          - vm@virtualbox
          - docker-vm@virtualbox
          - per-machine@virtualbox
          - attack-box:vm@virtualbox
          - attack-box:docker-vm@virtualbox
          - machine-setup@virtualbox
        gaps:
          integration: runs only with CYBERCTF_TEST_VM_PROVIDER=virtualbox; every rig virtualbox cell (Linux, Windows, macOS) is prepared/not run

      - id: providers.hyperv
        what: "VM-form labs on Hyper-V (Windows): VM labs and one VM per machine, no container-in-a-VM, no shared folder."
        platforms:
          - windows
        providers:
          - hyperv
        host: true
