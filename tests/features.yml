# The feature registry: every feature the launcher offers its user, area by area, and the tests
# that check it, tier by tier. tests/README.md ("The feature registry") says what each field is
# and how a test is registered; `pnpm check:features` holds this file to the repository, and
# `pnpm features` writes tests/FEATURES.md from it.
#
# A tier's tests are what checks the feature's BEHAVIOUR: a test that only renders a page is
# listed with a `gaps` note for its tier (it then shows ◐). `host: true` marks a feature that
# depends on the real machine (Docker, a hypervisor, a server, a cloud): the dev mock's web tests
# prove nothing about it. `known_gaps` (at the end) are the gaps the owner tracks.

areas:

  - id: account
    title: Account and sign-in
    features:
      - id: account.sign-in-browser
        what: Sign in to Cyber CTF in the system browser, the app picking up the redirect by itself; the wait can be cancelled or the link copied.
        host: true
        commands:
          - auth_login
          - auth_login_cancel
        tests:
          unit:
            - src-tauri/src/account/auth.rs > the_sign_in_link_is_given_before_the_wait_and_cancel_ends_it
            - src-tauri/src/account/auth.rs > the_code_exchange_sends_the_pkce_verifier_and_reads_who_signed_in
            - src-tauri/src/account/auth/callback.rs > a_callback_with_a_wrong_or_missing_state_is_ignored
            - src-tauri/src/account/auth/callback.rs > sign_in_fails_plainly_when_every_callback_port_is_busy
            - src-tauri/src/account/auth/waiting.rs > a_second_sign_in_ends_the_first
            - src/features/account/account.test.tsx > while waiting, offers the sign-in link to copy and a Cancel that ends it quietly
          web:
            - signed-out.spec.ts > the wait shows what to do and the ways out
        gaps:
          desktop: "no spec signs in: the rig's desktop runs get a pre-made session (CYBERCTF_TEST_ACCOUNT_SESSION); the browser hand-off and loopback redirect never run for real"
          integration: none against the real cyber-auth
        note: The Rust side runs the redirect against local fake servers; the web tier fakes the whole sign-in in the dev mock.

      - id: account.sign-in-with-code
        what: Sign in with a code entered on another device when the browser here can't be used, with its expiry shown.
        host: false
        commands:
          - auth_login_device
        tests:
          unit:
            - src-tauri/src/account/auth/device.rs
            - src-tauri/src/account/auth.rs > a_sign_in_with_a_code_shows_it_then_keeps_the_session
            - src-tauri/src/account/auth.rs > a_sign_in_with_a_code_can_be_cancelled
            - src/features/account/account.test.tsx > switches to a code entered on another device
            - src/features/account/account.test.tsx > says when the code ran out
            - src/features/account/sign-in.test.ts > switches a waiting browser sign-in to a code
          web:
            - signed-out.spec.ts > a code instead, or Cancel
        gaps:
          integration: never run against the real cyber-auth device endpoint

      - id: account.session-status
        what: See who is signed in (name, email, picture) in the sidebar and Settings > Account; the session is kept in the OS keychain and renewed silently, and an expired one is said until the next sign-in.
        host: true
        commands:
          - auth_status
        pages:
          - settings:account
        tests:
          unit:
            - src-tauri/src/account/auth.rs > an_expired_token_is_refreshed_silently_and_a_refused_refresh_signs_out
            - src-tauri/src/account/auth.rs > an_expired_session_without_a_refresh_token_says_session_expired
            - src-tauri/src/account/auth.rs > a_corrupt_stored_session_reads_as_signed_out_without_an_error
            - src-tauri/src/account/auth/store.rs > a_session_too_long_for_one_windows_credential_is_split_and_joined_back
            - src/components/shell-behavior.test.tsx > says once, as a toast, when a re-read finds the session expired under the app
            - src/features/settings/settings-rows.test.tsx > shows the signed-in player and this machine's agent
          web:
            - signed-out.spec.ts > a session that expired under the app is said, in the sidebar and in Settings
            - signed-out.spec.ts > the list, a lab, the sidebar and Settings say so
        gaps:
          desktop: auth_status is only read to decide whether signed-in specs skip; nothing checks the account row, and the rig's session is a dev-session.json file, so the real keychain path never runs
          integration: no real keychain round trip (Windows Credential Manager, macOS Keychain, Secret Service) on any host

      - id: account.sign-out
        what: Sign out from Settings > Account; the session is forgotten and every window reads signed out.
        host: true
        commands:
          - auth_logout
        tests:
          unit:
            - src-tauri/src/account/auth.rs > the_status_follows_the_kept_session_and_logout_forgets_it
            - src-tauri/src/account/auth.rs > a_sign_out_during_a_refresh_in_flight_stays_signed_out
            - src-tauri/src/account/auth/store.rs > a_session_is_forgotten_only_when_its_store_lets_it_go
            - src/features/settings/settings-rows.test.tsx > signs out
            - src/features/account/account.test.tsx > says a sign-out the keychain refused
        gaps:
          web: no spec presses Sign out (signed-out.spec starts signed out)
          integration: keychain removal never run on a real OS store

      - id: account.signed-out-states
        what: Signed out, the app stays usable (browse labs, imported labs) and says so in one banner, the lab page, the sidebar and Settings, recovering at once on sign-in in any window.
        host: false
        tests:
          unit:
            - "src/features/labs/labs-screen.test.tsx > signed out: one sign-in banner above the list"
            - src/features/settings/settings-screen.test.tsx > works signed out
            - src/components/shell/screens.test.tsx > asks a signed-out player to sign in
            - src/components/shell-behavior.test.tsx > reads the session again on focus, a signed-out action, or another window's change
            - src/features/labs/use-lab-actions.test.tsx > tells the shell the session is gone from a signed-out error's code
            - src/features/frontend-races.test.tsx > shows no other sign-in state's catalogue
          web:
            - signed-out.spec.ts > the list, a lab, the sidebar and Settings say so
            - signed-out.spec.ts > signing in from the Labs list banner recovers the list and the lab
            - coded-errors.spec.ts > a start that finds the session gone
          desktop:
            - fail-signedout
        rig:
          - desktop-e2e
        gaps:
          desktop: fail-signedout only checks the Overview mentions 'sign in' and has a heading; no banner, lab page or recovery checked

      - id: account.start-after-sign-in
        what: Pressing Sign in to start (a lab's header or an Overview row) signs in and then carries on into that lab's start or page.
        host: false
        tests:
          unit:
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > signs a signed-out player in from the header, then starts the lab here
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > asks where to run once a sign-in from the header went through
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > a sign-in from the header that was cancelled, or a lab that is busy, starts nothing
            - src/features/labs/lab-parts.test.tsx > signs a signed-out player in from the row
            - src/features/labs/lab-failures.test.tsx > is said from the lab page's header
          web:
            - signed-out.spec.ts > signing in from a lab's header goes on into its start
            - signed-out.spec.ts > signing in from a lab's row on the Overview opens that lab
        gaps:
          desktop: not driven (needs a real sign-in)

      - id: account.backend-requests
        what: The catalogue, briefs, progress and answers are read from Cyber CTF with the player's session (anonymously when signed out), only through named operations, an outage told apart from a refusal.
        host: false
        commands:
          - api_query
        tests:
          unit:
            - src-tauri/src/account/api.rs > only_a_missing_session_makes_a_call_anonymous
            - src-tauri/src/account/api.rs > a_refused_call_is_invalid_and_an_outage_is_unreachable
            - src-tauri/src/account/api.rs > an_operation_is_posted_with_the_token_and_its_data_read_back
            - src-tauri/src/account/api_operation.rs > a_graphql_document_or_an_unknown_name_is_refused
            - src-tauri/src/commands/account.rs > a_webview_can_run_named_operations_only
          desktop:
            - labs/list
            - fail-offline
          integration:
            - src-tauri/src/account/api.rs > queries_the_api_anonymously
        rig:
          - desktop-e2e
        gaps:
          web: api_query is answered by the dev mock; only its failure is forced (failures.spec)
          integration: "the real-backend test is #[ignore] (network) and in no runner or rig suite"
        note: The command behind every catalogue read; the catalogue features list what the player sees of it.

  - id: website
    title: Website links and launches
    features:
      - id: website.deep-links
        what: A cyberctf://labs/<slug> link from the website opens that lab's page (never starts it), at launch or while the app runs; other links are ignored.
        host: true
        tests:
          unit:
            - src/lib/deep-link.test.ts
            - src/components/shell-interaction.test.tsx > opens a lab linked while the app runs, whatever screen is open
            - src/components/shell-interaction.test.tsx > ignores links that aren't lab links, and never starts anything
            - src/features/labs/labs-screen.test.tsx > waits for the catalogue before opening a lab from a link
            - src/components/shell/screens.test.tsx > opens a lab's page from a deep link and goes back
          web:
            - app-events.spec.ts > a link opened while the app runs shows that lab
            - app-events.spec.ts > the link the app was opened with shows its lab once
          desktop:
            - deep-link
        rig:
          - desktop-e2e
        gaps:
          desktop: the running-app link is emitted as the plugin's event, not handed over by the OS; launch-link skips on macOS
          integration: the OS scheme registration (installers) and a second launch handing the link to the first are not checked by any tier here (left to the packaging smoke)

      - id: website.agent-online
        what: Signed in, this machine registers with the website and shows Online there and in the app, so labs can be launched on it from the browser.
        host: false
        commands:
          - agent_info
        tests:
          unit:
            - src-tauri/src/account/agent/registration.rs > the_agent_registers_again_for_another_account_and_forgets_it_on_sign_out
            - src-tauri/src/account/agent/registration.rs > the_agent_is_online_only_registered_and_never_against_the_policy
            - src-tauri/src/account/agent/identity.rs > the_install_id_is_made_once_and_kept
            - src/features/settings/settings-screen.test.tsx > reads the agent again as it registers, and shows it online once it is
            - src/components/ui-behavior.test.tsx > marks the player online only once the website sees this machine
        gaps:
          web: the agent state is a dev-mock constant; no spec checks Online/Registering
          integration: never registered against a real CyberBackend

      - id: website.launch-from-website
        what: A lab launched from the website onto this machine (or a server/cloud picked there) is asked about here first (lab, place, privileged machines) and runs only on Approve; Decline, Escape or a timeout start nothing.
        providers:
          - docker
          - proxmox
          - esxi
          - aws
          - azure
          - gcp
        host: true
        commands:
          - confirm_launch
        tests:
          unit:
            - src-tauri/src/account/agent/confirm.rs
            - src-tauri/src/account/agent.rs > a_launch_runs_on_its_picked_host_else_here
            - src-tauri/src/account/agent.rs > a_refused_website_launch_leaves_the_lab_running_on_the_players_account
            - src-tauri/src/account/agent.rs > only_a_start_that_brought_something_up_is_undone
            - src/features/app/launch-confirm.test.tsx
            - src/features/frontend-races.test.tsx > expires by the backend's deadline instead of letting a late Approve do nothing
          web:
            - app-events.spec.ts > a website launch onto a cloud account waits for Approve or Decline
            - a11y.spec.ts > a launch from the website waiting for approval passes too
        gaps:
          desktop: no spec answers a real website launch
          integration: the claim, run and report back are never run against a real backend or on a real lab

      - id: website.same-machine-check
        what: When a website launch runs here, the website can confirm the lab's 127.0.0.1 address is this machine through a one-time loopback probe before linking to it.
        host: false
        tests:
          unit:
            - src-tauri/src/account/colocation.rs > returns_the_nonce_only_with_the_right_token_and_echoes_allowed_origin
            - src-tauri/src/account/colocation.rs > a_foreign_origin_gets_no_nonce_and_spends_nothing
            - src-tauri/src/account/colocation.rs > only_a_loopback_host_on_this_port_reads_the_nonce
            - src-tauri/src/account/colocation.rs > a_new_launch_or_the_lab_stopping_retires_the_server
            - src-tauri/src/account/colocation.rs > serve_answers_once_on_loopback_then_closes
        gaps:
          integration: never probed by the real website

  - id: catalogue
    title: Catalogue, lab install and update
    features:
      - id: catalogue.browse
        what: The Labs screen lists the catalogue labs this launcher can run, running ones pinned on top, with counts (in the catalogue, running, solved) and placeholder rows while it loads; browsing needs no account.
        host: false
        pages:
          - tab:labs
        tests:
          unit:
            - src-tauri/src/account/api_operation.rs > the_catalogue_lists_only_labs_this_launcher_can_run
            - src/features/labs/labs-screen.test.tsx > pins running labs on top and sorts the rest by title
            - src/features/labs/labs-screen.test.tsx > shows placeholder rows while the catalogue loads
            - src/features/labs/labs-screen.test.tsx > opens a lab from its row and comes back to the list
            - src/features/labs/labs-interaction.test.tsx > a lab row is a role=button with its action buttons inside it
          web:
            - labs.spec.ts > the list shows the catalogue
            - labs.spec.ts > Escape on a lab page goes back to the list
          desktop:
            - labs/list
        rig:
          - desktop-e2e
        gaps:
          desktop: only checks the list answered ('in the catalogue' line); no row content or count checked

      - id: catalogue.search-and-filter
        what: Narrow the lab list by search (titles, categories, descriptions, skills, accents ignored) and by status, runtime and level filters, with a "No labs match" state.
        host: false
        tests:
          unit:
            - src/features/labs/lab-filters.test.ts
            - src/features/labs/labs-screen.test.tsx > filters by status, runtime, level and search, and says when nothing matches
            - src/features/labs/labs-interaction.test.tsx > picks a filter with Tab and the arrow keys, and the list follows
            - src/features/labs/labs-interaction.test.tsx > searches as the player types, ignoring case and accents
          web:
            - labs.spec.ts > filters narrow the list
          desktop:
            - labs/search
        rig:
          - desktop-e2e
        gaps:
          desktop: search only (one match, then no match); the filters are not driven against the real catalogue

      - id: catalogue.unreachable
        what: When Cyber CTF's catalogue can't be reached, the Labs screen and Overview say so with Retry, while labs running here and imported labs stay listed.
        host: false
        tests:
          unit:
            - src/features/labs/labs-screen.test.tsx > says the catalogue can't be reached
            - src/features/labs/labs-screen.test.tsx > offers a Retry when the catalogue can't be reached, which loads it again
            - src/features/failure-states.test.tsx > keeps the running lab on the Overview by its id, and offers Retry instead of loading forever
            - src/features/failure-states.test.tsx > lists the running lab above the Labs screen's error too
            - src/components/shell/shell-model.test.ts > keeps the labs the list doesn't have (the catalogue unreachable), by id
          web:
            - failures.spec.ts > labs running here stay listed while the catalogue can't be reached
          desktop:
            - fail-offline
        rig:
          - desktop-e2e
        gaps:
          desktop: fail-offline only matches a loose 'can't reach|offline|no labs' text and that the sidebar exists; Retry and kept running labs not checked

      - id: catalogue.lab-brief
        what: A catalogue lab's page shows its brief, details and where it can run, read from its isoloom.yml at the pinned commit before anything is installed.
        host: false
        tests:
          unit:
            - src-tauri/src/runtime/lab.rs > a_spec_not_installed_is_fetched_once_per_commit
            - src-tauri/src/runtime/lab.rs > a_source_its_check_refuses_is_never_fetched
            - src-tauri/src/labs.rs > only_cyberctf_repos_at_full_shas
            - src-tauri/src/commands/labs.rs > the_preview_command_reads_the_installed_copy_and_refuses_a_source_the_catalogue_doesnt_allow
            - src/features/labs/lab-failures.test.tsx > says the brief couldn't be read and why, never that the lab has none
            - src/features/labs/lab-detail/where-it-runs.test.tsx
          desktop:
            - labs/catalogue-page
        rig:
          - desktop-e2e
        gaps:
          web: lab pages are opened in many specs but none checks the brief or Where it runs panel
          desktop: only checks the Brief and Where it runs/Details headings appear
          integration: the GitHub raw fetch of isoloom.yml is never exercised outside the desktop run

      - id: catalogue.download-install
        what: Starting a catalogue lab downloads it from its CyberCTF repository at the pinned commit and installs it safely (size-limited, no path escape, Windows-safe names).
        host: true
        tests:
          unit:
            - src-tauri/src/labs.rs > an_archive_download_is_limited_and_says_why_it_failed
            - src-tauri/src/labs.rs > staging_carries_the_lab_its_commit_and_its_instance_but_no_stale_place
            - src-tauri/src/labs.rs > a_launch_waits_for_the_lab_lock_before_installing_anything
            - src-tauri/src/labs/archive/tests.rs
            - src-tauri/src/labs/archive/proptests.rs
          desktop:
            - lab-form-container
            - lab-actions
        rig:
          - desktop-e2e
        gaps:
          web: the dev mock has no download
          desktop: "indirect: lab-form/lab-actions start a catalogue lab (which downloads it) but never check the installed copy or commit; need a signed-in session (CYBERCTF_TEST_ACCOUNT_SESSION) and skip without one"
          integration: "no scenario downloads from GitHub: every integration lab is a local folder copy"

      - id: catalogue.update-installed-lab
        what: A newer pinned commit of an installed lab replaces the old copy on the next start, never while the old one runs or is parked, and never leaving a half-installed lab.
        host: true
        tests:
          unit:
            - src-tauri/src/labs.rs > a_new_lab_version_is_installed_unless_the_old_one_still_runs
            - src-tauri/src/labs.rs > a_new_lab_version_is_refused_while_a_parked_copy_couldnt_be_taken_down
            - src-tauri/src/labs.rs > an_update_with_a_file_held_open_keeps_the_installed_lab_whole
            - src-tauri/src/labs.rs > a_failed_update_that_cant_put_the_old_copy_back_says_where_it_is
            - src-tauri/src/labs.rs > a_leftover_staging_folder_is_replaced_whole_and_an_installed_marker_is_trimmed
          integration:
            - replace-docker
            - replace-docker-vm
            - replace-vm
        rig:
          - container
          - docker-vm
          - vm
        gaps:
          desktop: no spec starts a catalogue lab at a new commit

      - id: catalogue.overview
        what: The Overview greets the player, says whether this machine is ready, lists what runs now (catalogue and imported labs) and offers Browse labs.
        host: false
        pages:
          - tab:home
        tests:
          unit:
            - src/features/home/home-model.test.ts
            - src/features/home/home-behavior.test.tsx > greets the player by first name and lists what runs
            - src/features/home/home-behavior.test.tsx > offers to set up Docker when it isn't ready, and says when that fails
            - src/features/home/home-behavior.test.tsx > browses the labs once Docker is ready
            - src/components/shell/screens.test.tsx > shows the dashboard for a signed-in player
          web:
            - navigation.spec.ts > every sidebar screen opens with its heading
            - docker-engine.spec.ts > engine stopped
          desktop:
            - launch
            - launch-ui
        rig:
          - desktop-e2e
        gaps:
          web: "partial: headings and the Docker-down line; the Running now list is only checked under a catalogue outage (failures.spec)"
          desktop: launch/launch-ui only wait for the seeded lab to read running on the Overview; need CYBERCTF_TEST_LOCAL_LAB

      - id: catalogue.overview-deploys-and-jump-back
        what: The Overview's deploy panel names each lab deploying (step, machine, link), and Jump back in lists the labs launched last with how long ago and resumes a parked one.
        host: false
        tests:
          unit:
            - src/features/home/home-behavior.test.tsx > names the one lab deploying, its step and machine, with a link to it
            - src/features/home/home-behavior.test.tsx > lists several deploys, each with its own link
            - src/features/home/home-behavior.test.tsx > resumes a parked lab from Jump back in
            - src/features/home/home-behavior.test.tsx > shows how long ago, and disables Resume while busy or not allowed
            - src/features/home/home-model.test.ts > lists the labs launched last, newest first, not running, at most three
        gaps:
          web: the mock deploys GOAD by default but no spec checks the deploy panel or Jump back in

      - id: catalogue.machine-summary
        what: The Overview's machine summary shows the engine state, containers, cores and usage, and warns a machine under 8 GB of RAM to use a server or the cloud.
        host: true
        tests:
          unit:
            - src/features/home/home-behavior.test.tsx > shows the engine state, containers and cores, or placeholders
            - src/features/home/home-behavior.test.tsx > warns a machine short on memory, pointing at a server or the cloud
            - src/features/home/home-behavior.test.tsx > writes memory and disk as the Machine page does
            - src/features/home/home-model.test.ts > counts the running labs' own containers only
          web:
            - docker-engine.spec.ts > engine stopped
        gaps:
          web: only the engine Stopped line; the low-RAM warning and usage are unit-only
          desktop: real metrics never checked on the Overview

  - id: imports
    title: Imported labs
    features:
      - id: imports.import-folder
        what: Import a lab from a local folder (Import a lab, system folder picker); it starts at once, a folder without a lab is refused, and cancelling the picker starts nothing.
        providers:
          - docker
        host: true
        commands:
          - lab_launch_local
        tests:
          unit:
            - src/features/labs/lab-failures.test.tsx > says the import failed when the folder picker fails, and offers to import again
            - src/features/labs/lab-failures.test.tsx > says the import failed when the lab can't start, with the reason
            - src/features/labs/lab-failures.test.tsx > starts nothing when the player cancels the picker
            - src-tauri/src/labs.rs > a_folder_without_a_lab_has_no_local_id
            - src-tauri/src/commands/labs.rs > lab_launch_local_refuses_a_folder_without_a_lab
          desktop:
            - labs/import
            - labs/imported-runs
            - labs/imported-stop
            - launch-ui
            - fail-badlab
          integration:
            - launch-commands
        rig:
          - desktop-e2e
          - container
        gaps:
          web: no spec imports a folder (the dev mock has no picker answer)
          desktop: needs CYBERCTF_TEST_LOCAL_LAB and Docker; skips without them; container labs only; fail-badlab checks only that the app stays usable and nothing runs, not the message
          integration: launch-commands is Docker only; no VM-form import

      - id: imports.imported-labs
        what: Imported labs are listed under "Imported from a folder" (Labs, Overview, sidebar) and get a page built from their .ctf/ folder (title, brief, read-only objectives), a bad .ctf file named.
        host: false
        commands:
          - imported_labs
        tests:
          unit:
            - src/features/labs/imported-labs.test.tsx
            - src/components/imported-lab-navigation.test.tsx
            - src-tauri/src/labs/ctf.rs
            - src-tauri/src/labs/imported.rs > only_imported_labs_are_listed_each_with_its_own_ctf_folder
            - src-tauri/src/commands/labs.rs > imported_labs_are_the_local_ones_with_what_their_ctf_folder_defines
            - src/features/failure-states.test.tsx > is listed on the Overview as imported, not as a catalogue outage
          web:
            - remove-lab.spec.ts > an imported lab is removed once asked
          desktop:
            - labs/imported-list
            - labs/imported-page
        rig:
          - desktop-e2e
        gaps:
          web: the dev mock's imported lab is listed and its page opens; its .ctf objectives and a bad .ctf file are unit-only
          desktop: needs CYBERCTF_TEST_LOCAL_LAB and Docker; the page check only looks for Objectives when the lab has objectives.json

      - id: imports.remove-lab
        what: Remove lab, on a stopped lab's page (an imported lab, or a catalogue lab installed here), deletes the app's copy and every record it keeps for it (its attack box's keychain password too, listed when a keychain refuses), never the folder it was imported from; asked first, disabled ("Stop the lab first") and refused by the core while the lab is up, parked or busy; back on the list with a toast, files left behind listed.
        host: false
        commands:
          - lab_remove
          - lab_installed
        tests:
          unit:
            - src-tauri/src/labs/remove/tests.rs
            - src-tauri/src/commands/labs.rs > an_installed_lab_is_removed_with_its_workers_files_and_refused_while_a_worker_runs
            - src/features/labs/lab-detail/remove-lab.test.tsx
            - src/lib/confirm.test.ts > warnInDialog
          web:
            - remove-lab.spec.ts > an imported lab is removed once asked
            - remove-lab.spec.ts > a running lab can't be removed until it is stopped
            - remove-lab.spec.ts > a removal that leaves files behind says which
        gaps:
          unit: a copy held open on Windows is a rename refused by a test double, not a real held file
          desktop: no desktop case removes a real lab

      - id: imports.legacy-deployment-handover
        what: After an upgrade, a Proxmox or cloud lab the launcher started on its old Terraform path is handed to the Isothrum runner once, or the player is told to remove it by hand.
        providers:
          - proxmox
          - aws
          - azure
          - gcp
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/import/tests.rs
            - src-tauri/src/runtime/isothrum/import/record.rs
        gaps:
          web: not user-visible beyond a log/notice; no spec
          integration: never run against a real old deployment on Proxmox or a cloud

  - id: lab-run
    title: Running a lab
    features:
      - id: lab-run.container
        what: Start a container lab on this machine's Docker engine, then Stop & remove it with nothing left.
        providers:
          - docker
        host: true
        commands:
          - lab_launch
          - lab_stop
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/tests.rs > a_container_lab_goes_up_through_the_runner_as_cyberctf_lab_id
            - src-tauri/src/runtime/isothrum/tests.rs > a_second_start_of_a_running_lab_is_refused_and_a_down_removes_it_all
            - src-tauri/src/runtime/launch/tests.rs > a_local_run_follows_the_runtime_and_the_hypervisor
            - src-tauri/src/runtime/lifecycle.rs > a_stop_says_what_it_cant_remove_of_a_deployment_the_runner_hasnt_taken_over
            - src/features/labs/lab-detail/lab-detail.test.tsx > offers to start a stopped Docker lab and starts it
            - src/features/labs/use-lab-actions.test.tsx > stops a lab with its runtime
          web:
            - lab-flow.spec.ts > search, open, start, watch the steps, open the shell, stop
            - labs.spec.ts > Stop & remove asks first, and Cancel keeps the lab
            - failures.spec.ts > a failed Stop & remove keeps the panels and says so under the header
          desktop:
            - launch
            - stop
            - lab-form-container
            - lab-actions/remove-cancel
            - lab-actions/remove
          integration:
            - docker-lab-hello-stack
            - docker-lab-segmented
            - launch-commands
            - corpus-docker
          setup:
            - selftest:docker
            - lab:<name>
        rig:
          - container
          - machine-setup
          - desktop-e2e
        gaps:
          desktop: launch/stop drive an imported lab seeded at startup; the catalogue start through the dialog (lab-form-container, lab-actions) needs a signed-in account and skips without it
          integration: green on the rig only on debian-13 (Docker Engine); no Windows or macOS (Docker Desktop) run yet
        note: lab_launch and lab_stop serve every form; the form features below say what each adds.

      - id: lab-run.docker-vm
        what: Start a container lab inside one local VM (the helper VM) and stop it, no VM left.
        providers:
          - libvirt
          - qemu
          - virtualbox
          - utm
          - vmware
          - parallels
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/docker_vm_tests.rs > a_container_lab_in_a_utm_vm_runs_with_nothing_of_the_runners_own_in_it
            - src-tauri/src/runtime/isothrum/docker_vm_tests.rs > a_start_in_a_utm_vm_tries_again_once_after_utms_passing_refusal
            - src-tauri/src/runtime/paths.rs > local_vm_marker_round_trips
            - src/features/labs/use-lab-actions.test.tsx > runs a container lab inside a local VM on the chosen hypervisor
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > asks where to run a container lab and starts it in a VM here
          desktop:
            - lab-form-docker-vm
          integration:
            - docker-vm-lab
        rig:
          - docker-vm
          - desktop-e2e
        gaps:
          web: no web spec starts a container lab in a VM
          desktop: needs a signed-in account and CYBERCTF_TEST_VM_PROVIDER; skips without them
          integration: "up and down only: no park/resume or checks for this form; green only on libvirt (debian-13)"
        note: Not offered on Hyper-V (Isoloom's docker-vm target has no Hyper-V provider).

      - id: lab-run.vm
        what: Start a VM lab as its own VMs on a local hypervisor (Vagrant), then stop it, no VM left there.
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/vm_tests.rs > a_vm_lab_goes_up_on_its_hypervisor_through_the_runner
            - src-tauri/src/runtime/isothrum/vm_tests.rs > the_lab_page_reads_a_vm_lab_while_its_start_provisions_it_in_another_process
            - src-tauri/src/runtime/launch/tests.rs > a_start_downloads_images_for_containers_here_and_boxes_for_every_vm_form_here
            - src-tauri/src/runtime/launch/tests.rs > qemu_emulates_only_the_vms_built_for_another_cpu
            - src/features/labs/use-lab-actions.test.tsx > runs a VM lab picked here on the hypervisor the backend picks for it there
          web:
            - "vm-labs.spec.ts > on this machine: up, pause, resume, provision one machine again, stop"
            - "vm-labs.spec.ts > on Apple Silicon: a VM lab built for arm64 runs on UTM, pauses, resumes and stops"
          desktop:
            - lab-form-vm
          integration:
            - vm-lab
          setup:
            - selftest:vm
            - lab:<name>
        rig:
          - vm
          - machine-setup
          - desktop-e2e
        gaps:
          desktop: needs a signed-in account, CYBERCTF_TEST_CATALOGUE_VM_LAB and CYBERCTF_TEST_VM_PROVIDER; skips without them
          integration: green only on libvirt (debian-13); qemu/virtualbox/hyperv/utm cells not run

      - id: lab-run.per-machine
        what: Start a container lab as one VM per machine on a local hypervisor, its page following that form.
        providers:
          - libvirt
          - qemu
          - virtualbox
          - hyperv
          - vmware
          - parallels
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/launch/tests.rs > a_container_lab_picked_as_one_vm_per_machine_runs_as_a_vm_lab
            - src-tauri/src/runtime/launch/tests.rs > a_container_lab_started_as_vms_takes_the_vm_path_and_every_operation_follows
            - src-tauri/src/runtime/launch/tests.rs > a_plain_container_start_forgets_an_earlier_per_machine_form
            - src-tauri/src/runtime/launch/tests.rs > one_vm_per_machine_is_refused_on_a_server_and_on_utm
            - src-tauri/src/runtime/paths.rs > a_container_lab_started_as_vms_runs_as_a_vm_lab_here
            - src/features/labs/use-lab-actions.test.tsx > runs a container lab with VM recipes as one VM per machine on the chosen hypervisor
          desktop:
            - lab-form-per-machine
          integration:
            - per-machine
        rig:
          - per-machine
          - desktop-e2e
        gaps:
          web: no web spec starts a lab as one VM per machine
          desktop: needs a signed-in account and CYBERCTF_TEST_VM_PROVIDER; skips without them
          integration: green only on libvirt (debian-13)
        note: Refused on UTM and on servers; offered on every cloud (cloud-vm).

      - id: lab-run.cloud-docker
        what: Start a container lab in one cloud instance of the player's account (cloud-docker), then destroy it.
        providers:
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/launch/tests.rs > the_cloud_form_sets_the_runtime_and_records_it
            - src-tauri/src/runtime/launch/tests.rs > the_public_ip_is_the_one_two_resolvers_agree_on
            - src-tauri/src/runtime/launch/tests.rs > an_aws_budget_blocks_only_when_it_is_known_to_be_over
            - src-tauri/src/runtime/isothrum/cloud.rs > a_change_on_aws_waits_for_a_signed_in_account
            - src/features/labs/lab-detail/lab-detail.cloud.test.tsx > starts on one of the player
          integration:
            - attack-box-aws-docker
        rig:
          - cloud
        gaps:
          web: no web spec starts a container lab on a cloud account (cloud-labs.spec is cloud services)
          desktop: no desktop spec starts a lab in a cloud
          integration: AWS only (the AWS tier, billed, opt-in); Azure, GCP, DigitalOcean, Linode, OCI never run; rig's cloud column excluded

      - id: lab-run.cloud-vm
        what: Start a VM lab (or a container lab as one VM per machine) as cloud instances in the player's account, then destroy it.
        providers:
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/launch/tests.rs > one_vm_per_machine_runs_on_every_cloud_and_on_no_server
            - src-tauri/src/runtime/lab/run_options/tests.rs > a_windows_vm_given_a_labs_input_runs_on_no_cloud_and_says_why
            - src-tauri/src/runtime/isothrum/cloud.rs > a_cloud_lab_generated_by_an_earlier_version_is_generated_again_then_read
            - src/features/labs/use-lab-actions.test.tsx > runs a dual-form container lab on a cloud account as one VM per machine (cloud-vm)
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > offers a dual-form container lab on a cloud the two cloud forms
          integration:
            - attack-box-aws-vm
        rig:
          - cloud
        gaps:
          integration: AWS only, opt-in billed tier; the other five clouds never run a lab; rig's cloud column excluded

      - id: lab-run.cloud-services
        what: Start a cloud-services lab (its own Terraform module) in the player's account, see its outputs, then destroy it.
        providers:
          - aws
          - azure
          - gcp
          - digitalocean
          - linode
          - oci
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/cloud_services.rs > set_up_steps_on_this_machine_are_refused_before_anything_runs
            - src-tauri/src/runtime/cloud_services.rs > the_allow_list_inputs_the_lab_asks_for_are_filled_with_this_machines_ip
            - src-tauri/src/runtime/isothrum/import/tests.rs > a_cloud_services_lab_takes_its_launch_values_into_its_run
            - src-tauri/src/runtime/lifecycle.rs > stopping_a_cloud_lab_that_runs_nowhere_clears_its_marks_without_running_anything
            - src/features/labs/cloud-labs.test.ts
            - src/features/labs/lab-detail/lab-detail.cloud.test.tsx > shows what a running one exposes, its secrets masked until asked
          web:
