        host: false
        tests:
          unit:
            - src/features/labs/lab-detail/lab-detail.test.tsx > shows a running Docker lab with its network, details and actions
            - src/features/labs/lab-detail/lab-state.test.ts > offers what the backend says the lifecycle accepts where the lab runs
            - src/features/labs/lab-detail/up-actions.test.tsx
            - src-tauri/src/runtime/lifecycle.rs > the_page_is_offered_what_the_lifecycle_accepts_where_the_lab_runs
            - src/features/labs/labs-interaction.test.tsx > cancels Stop & remove in the system dialog and stays on the lab page
          web:
            - labs.spec.ts > Escape on a lab page goes back to the list
            - lab-flow.spec.ts > search, open, start, watch the steps, open the shell, stop
          desktop:
            - lab-actions
        rig:
          - desktop-e2e

      - id: lab-page.network-diagram
        what: A running lab's network drawn with its machines, addresses, published ports, the attack box and where it runs; click to copy an address.
