            - src-tauri/src/machine/tools/scripts.rs > docker_install_adds_the_player_to_the_docker_group
            - src-tauri/src/machine/tools/scripts.rs > docker_picks_its_apt_repository_by_distro_or_the_distributions_own_docker
            - src-tauri/src/machine/tools/install.rs > docker_is_named_as_the_setup_installs_it_on_each_os
