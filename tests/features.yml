          unit:
            - src-tauri/src/runtime/isothrum/tests.rs > the_labs_checks_run_through_the_runner
            - src-tauri/src/commands/labs.rs > a_lab_on_a_server_host_has_no_local_check
            - src-tauri/src/runtime/host.rs > cloud_services_have_no_machines_to_check_nor_to_put_an_attack_box_beside
            - src/features/labs/lab-parts.test.tsx > checks once per incident whether the lab is still solvable
            - src/features/frontend-races.test.tsx > checks again when another container goes down mid-check
          integration:
            - docker-lab-hello-stack
            - docker-lab-segmented
            - launch-commands
            - corpus-docker
            - vm-lab
            - server-lab-proxmox
            - server-lab-esxi
        rig:
          - container
          - vm
          - server:proxmox
          - server:esxi
        gaps:
          desktop: lab-actions/down waits for the down banner, not for the check's verdict
          integration: no check for docker-vm, per-machine or cloud forms

      - id: lab-run.deploy-progress
        what: Follow a start or operation as steps and its live log (deploy steps UI, sidebar busy marks), from the detached worker, also after a reload.
        host: false
        commands:
          - busy_labs
          - active_operations
          - lab_deploy_log
        tests:
          unit:
            - src-tauri/src/app/operations.rs > a_running_worker_is_listed_at_its_step_and_its_log_read_back
            - src-tauri/src/app/deploy_worker/progress.rs > tail_follows_the_log_to_the_verdict
            - src-tauri/src/runtime/deploy_log.rs > the_lines_read_as_the_lab_page_expects_them
            - src/features/labs/deploy-steps.test.tsx
            - src/features/labs/deploy-log.test.ts
            - src/features/labs/runs/runs.test.tsx
          web:
            - lab-flow.spec.ts > search, open, start, watch the steps, open the shell, stop
            - failures.spec.ts > a deploy with no log here shows the backend
          desktop:
            - park-resume
          integration:
            - launch-commands
        rig:
          - container
          - desktop-e2e
        gaps:
          desktop: no spec reads the deploy steps or log on the page; busy_labs is only polled as a wait helper
          integration: launch-commands streams the log but asserts only the outcome

      - id: lab-run.image-download
        what: A container lab's images are pulled in a step of their own, shown as the lab page's Get images phase; a pull that stops making progress or fails says so (the minutes without progress and the network hint, or Docker's reason), not that Docker ran out of resources.
        providers:
          - docker
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/errors.rs > a_download_that_stalled_or_failed_says_so_not_the_resources
            - src-tauri/src/runtime/isothrum/tests.rs > an_attack_box_whose_image_cant_be_downloaded_says_so_after_its_pull
            - src/features/labs/deploy-log.test.ts > the runner's pull before the containers start is the images phase, its progress in it
            - src/features/labs/deploy-steps.test.tsx > starts over on a new run, and ticks the running step's time on its own
            - src/features/labs/failure-hints.test.ts > reads a download of the lab's images that stalled as the network, and one that failed by Docker's words
            - src/lib/errors.test.ts > "downloadStalled"
          web:
            - lab-flow.spec.ts > search, open, start, watch the steps, open the shell, stop
          integration:
            - docker-lab-hello-stack
            - docker-lab-segmented
            - attack-box-docker
        rig:
          - container
          - attack-box:docker
        gaps:
          web: lab-flow only sees the Get images step; no dev-mock flag makes a pull stall or fail
          integration: the scenarios pull real images, so the Get images phase runs for real, but none provokes a stalled or failed pull; the runner's own pull-phase tests are Isothrum's, outside this repository
        note: The download-phase fix (f69e4bd9) gave the stall and the failure their own codes, downloadStalled and downloadFailed, in the six languages.

      - id: lab-run.interrupted-deploy-recovery
        what: Quitting or killing the app mid-deploy never cuts it short (detached worker); quit asks first, and a reopened app shows a coherent state and offers to clean up an interrupted start.
        host: true
        tests:
          unit:
            - src-tauri/src/app/quit.rs > a_background_finish_stays_open_once_relaunched_and_a_forced_quit_exits_at_once
            - src-tauri/src/app/deploy_worker.rs > a_job_runs_inside_the_app_when_no_worker_can_be_started
            - src-tauri/src/app/deploy_worker/worker.rs > a_job_that_panics_ends_with_its_verdict_instead_of_hanging
            - src-tauri/src/app/deploy_worker/progress.rs > a_worker_gone_without_a_status_says_how_it_ended_and_its_last_line
            - src/features/labs/lab-detail/lab-state.test.ts > recovers a deploy the backend still runs after a reload
            - src/features/labs/lab-detail/lab-detail.behavior.test.tsx > cleans up a start that was interrupted
          web:
            - "app-events.spec.ts > quitting during a deploy asks first: keep waiting, Escape, or finish in the background"
          desktop:
            - kill-mid-deploy
        rig:
          - desktop-e2e
        gaps:
          desktop: kill-mid-deploy only checks the reopened window renders with no error screen; it never checks the deploy finished in its worker, nor the lab's state or a clean-up
          integration: the killed start's scenarios are resilience.killed-start's; none kills the app itself mid-deploy

      - id: lab-run.running-labs-scan
        what: Labs already running here (started from the website, before a crash or restart) are found by asking Docker and each hypervisor, and listed as running.
        providers:
          - docker
          - libvirt
          - virtualbox
          - hyperv
          - utm
          - vmware
          - parallels
        host: true
        commands:
          - running_labs
        tests:
          unit:
            - src-tauri/src/runtime/discover.rs > docker_projects_keep_only_cyberctf_labs_stripped_and_unique
            - src-tauri/src/runtime/discover.rs > running_vms_map_back_to_installed_labs_by_name
            - src-tauri/src/runtime/discover.rs > every_hypervisor_probe_says_a_failure_and_stays_quiet_when_not_installed
            - src-tauri/src/commands/labs.rs > running_labs_lists_nothing_when_no_lab_is_running
            - src/features/labs/lab-polling.test.tsx > reads a lab as soon as the scan sees it start or stop
            - src/components/shell/use-sidebar-labs.test.tsx > lists a lab the running scan sees
          desktop:
            - restart
            - vm-scan
        rig:
          - desktop-e2e
        gaps:
          desktop: vm-scan needs a VM set up by the caller (CYBERCTF_TEST_SCAN_LAB); run.sh does it for UTM only
          integration: none; VirtualBox, VMware and Parallels probes only unit-tested on canned output

      - id: lab-run.status
        what: The lab page and lists read each lab's state (running, parked, down machines, URL, place) wherever it runs, polled while it can change.
        host: true
        commands:
          - lab_status
        tests:
          unit:
            - src-tauri/src/runtime/status.rs > what_is_still_up_is_read_from_the_runners_record_wherever_it_runs
            - src-tauri/src/runtime/status.rs > a_deployment_that_cant_be_read_is_an_error_never_nothing_up
            - src-tauri/src/commands/labs.rs > a_lab_that_isnt_installed_reads_as_not_running
            - src-tauri/src/runtime/isothrum/vm_tests.rs > the_apps_reads_of_a_vm_lab_never_ask_vagrant_at_once
            - src/features/labs/lab-polling.test.tsx
            - src/features/labs/lab-store.test.ts
          web:
            - lab-flow.spec.ts > a running lab's page survives a round trip through other screens
          desktop:
            - launch
            - launch-ui
          integration:
            - launch-commands
            - docker-lab-hello-stack
            - vm-lab
            - docker-vm-lab
            - per-machine
            - server-lab-proxmox
        rig:
          - container
          - docker-vm
          - vm
          - per-machine
          - server:proxmox
          - desktop-e2e

      - id: lab-run.offline-start
        what: When Cyber CTF can't be reached, start an installed catalogue lab offline from the copy here (offered, never forced).
        providers:
          - docker
        host: true
        tests:
          unit:
            - src-tauri/src/labs/offline.rs > an_unreachable_backend_offers_then_starts_an_installed_lab_offline
            - src-tauri/src/labs/offline.rs > a_backend_that_answers_is_never_bypassed
            - src-tauri/src/labs/offline.rs > a_cloud_lab_never_starts_offline
            - src-tauri/src/commands/labs.rs > lab_launch_offline_refuses_a_lab_that_is_not_installed
            - src/features/labs/use-lab-actions.test.tsx > offers an offline start when Cyber CTF can
            - src/features/labs/use-lab-actions.test.tsx > never offers an offline start for a refusal or a lab that can't start offline
          web:
            - "coded-errors.spec.ts > Cyber CTF unreachable with the lab installed here: accepting starts it offline"
            - "coded-errors.spec.ts > Cyber CTF unreachable with the lab installed here: declining the offline start keeps the failure"
          desktop:
            - offline-start
        rig:
          - desktop-e2e
        gaps:
          desktop: needs a signed-in account and Docker; skips without them; the container form only
          integration: no offline start in any form outside the desktop run

      - id: lab-run.failures-and-retry
        what: A failed start or operation says why (coded, translated, with a hint and the failed step) under the header, and Retry starts again.
        host: true
        tests:
          unit:
            - src-tauri/src/runtime/isothrum/errors.rs > a_failed_step_says_which_and_why_and_a_pool_overlap_what_to_do
            - src-tauri/src/runtime/isothrum/errors.rs > a_vm_labs_own_failures_say_what_to_do
            - src-tauri/src/runtime/isothrum/errors.rs > docker_not_answering_its_probe_reads_as_a_stopped_engine
            - src/features/labs/failure-hints.test.ts
            - src/features/failure-states.test.tsx > offers no port retry for another cause, and a failed stop is not a failed start
            - src/features/labs/labs-interaction.test.tsx > shows a start that fails with its reason, marks the step failed, and offers Start again
          web:
            - "launch-fail.spec.ts > a VM lab on this machine: Vagrant's failure under the header, then Retry brings it up"
            - failures.spec.ts > a start that fails says so in the header, with Retry and the port hint
            - "coded-errors.spec.ts > Docker not running: the header, the list's readiness, the dialog, and the start's message"
            - coded-errors.spec.ts > an expired session and a missing tool say their translated messages, with their hints
          desktop:
            - fail-docker
            - fail-badlab
        rig:
          - desktop-e2e
        gaps:
          desktop: fail-docker and fail-badlab check the app stays usable and nothing runs, not the message or Retry
          integration: real tool failures (Vagrant, Terraform, Compose) are only replayed from canned output

  - id: providers
    title: Hypervisors and engines
    features:
