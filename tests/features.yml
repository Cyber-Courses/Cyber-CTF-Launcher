            - src-tauri/src/runtime/proxmox/placement.rs > nodes_online_first_and_storages_that_can_be_used
            - src-tauri/src/runtime/server/input.rs > a_proxmox_login_gets_pam_when_it_names_no_realm
            - "src/features/servers/host-setup/server-setup.test.tsx > switches node: its own storages and bridge are picked"
