            - src-tauri/src/machine/setup/tests.rs > the_setups_own_hypervisor_is_an_installed_one_that_runs_else_installed_else_installable
            - src-tauri/src/machine/setup/tests.rs > a_ready_machine_has_nothing_to_do
            - src-tauri/src/integration_tests/setup.rs > a_check_only_pass_on_a_bare_debian_says_each_install_it_would_make
