        tests:
          unit:
            - src-tauri/src/commands/server.rs > hosts_are_saved_listed_tested_and_removed_through_the_commands
            - src-tauri/src/runtime/server/store.rs > an_unreadable_store_is_an_error_never_no_such_host
            - src-tauri/src/runtime/server/hosts/tests.rs > running_labs_count_per_host_and_skip_blank_markers
            - src/features/servers/servers-model.test.ts > summarises the hosts
