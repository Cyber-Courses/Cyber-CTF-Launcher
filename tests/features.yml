            - src-tauri/src/machine/storage.rs > reads_boxes_from_vagrantfiles
            - src-tauri/src/machine/storage/owned/record.rs > box_listings_read_as_name_provider_and_version
            - src/features/machine/machine-interaction.test.tsx > says the read failed and why, never that nothing was downloaded
            - src/features/machine/machine-interaction.test.tsx > counts the provider plugins labs share in what is stored
