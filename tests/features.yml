            - src-tauri/src/machine/selftest/vm.rs > an_earlier_tests_vm_is_removed_before_the_test_and_a_foreign_one_stops_it
            - src-tauri/src/machine/selftest/downloads.rs > adding_a_box_that_stalls_is_given_up_on_instead_of_spinning
