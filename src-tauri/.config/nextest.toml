# cargo-nextest, the Rust tests' runner (the check's unit-rust and coverage-rust steps): each test
# in its own process.

[profile.default]
# A flaky test fails loudly: nothing is retried.
retries = 0
# Every test runs, so one failure doesn't hide another.
fail-fast = false
# A test still running after 60 s is reported as slow, and listed again in the summary.
slow-timeout = { period = "60s" }
final-status-level = "slow"
