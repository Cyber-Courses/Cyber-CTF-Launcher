[package]
name = "cyberctf-desktop"
version = "1.4.1"
description = "CyberCTF desktop launcher: runs Docker and VM labs locally"
authors = ["Cyber-Courses"]
license = ""
repository = "https://github.com/Cyber-Courses/Cyber-CTF-Launcher"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cyberctf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The engineering standard's lints (thresholds in clippy.toml). Everything is denied, so a plain
# `cargo clippy` fails on it; a lint at "warn" is one the code doesn't meet yet, counted by the
# quality ratchet (`pnpm quality`, quality-baseline.json): its count may go down, never up.
[lints.rust]
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.33"
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "net", "signal"] }
thiserror = "2"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
flate2 = "1.1.10"
tar = "0.4.46"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde_yaml_ng = "0.10.0"
# Labs describe themselves with an isoloom.yml; the launcher generates and runs their files.
# Pinned to a commit of isoloom's v1 `main` until v1.0.0 is tagged; move to that tag then. Only
# `src/runtime/lab/` calls these crates, each the layer it needs: the spec (`isoloom-spec`), the
# check plan (`isoloom-plan`), the backends' registry and the resolved snapshot
# (`isoloom-targets`), the host's readiness and the registry of running environments
# (`isoloom-runtime`).
isoloom-spec = { git = "https://github.com/isoloom/isoloom", rev = "ba771a3bb034fa6f95f56e8e087ff9133349dbf8" }
isoloom-plan = { git = "https://github.com/isoloom/isoloom", rev = "ba771a3bb034fa6f95f56e8e087ff9133349dbf8" }
isoloom-targets = { git = "https://github.com/isoloom/isoloom", rev = "ba771a3bb034fa6f95f56e8e087ff9133349dbf8" }
isoloom-runtime = { git = "https://github.com/isoloom/isoloom", rev = "ba771a3bb034fa6f95f56e8e087ff9133349dbf8" }
# The map type of the Isoloom crates' API (a cloud-services lab's outputs).
indexmap = "2"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
# The TypeScript types of the commands' arguments and results, derived from these structs
# (see `ts_bindings.rs`).
ts-rs = "12"
# A POSIX shell-word splitter: the in-app terminal on Windows (no `sh`, and cmd.exe can't read
# POSIX quoting) runs its `sh_quote`d command lines' words directly; tests check `sh_quote`
# round-trips through it.
shell-words = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job objects: a timed tool's whole process tree ends with it on Windows. Shell (and Registry, which
# its SHELLEXECUTEINFOW needs): the UAC-elevated Vagrant for Hyper-V.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
# Property tests for the parsers of tool output and user input: never panic, round-trips,
# quoting invariants.
proptest = { version = "1", default-features = false, features = ["std"] }
# Tauri's mock runtime, so code taking an app handle runs in unit tests (see `AppRuntime`).
tauri = { version = "2.12.0", features = ["test"] }
