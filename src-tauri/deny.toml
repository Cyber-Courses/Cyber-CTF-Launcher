# cargo-deny: the dependency policy for the Rust core, checked in CI (`cargo deny check`, ci.yml).
# Run it here with `cargo deny --manifest-path src-tauri/Cargo.toml check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Every platform the launcher ships for, so a Windows- or macOS-only crate is checked too.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
# RustSec advisories: a vulnerable crate fails; so does an unmaintained or yanked one we depend on
# directly or through others. An exception goes in `ignore` with the advisory id and why.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # zip 4.x, through tauri-plugin-updater on Windows only. Its extraction flaws need an
  # attacker-made archive; the updater extracts only an update whose minisign signature it has
  # checked against the launcher's own public key (tauri.conf.json), i.e. one made by our release
  # pipeline. Drop these once tauri-plugin-updater depends on zip >= 9.
  { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater: extracts signed updates only" },
  { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater: extracts signed updates only" },
  { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater: extracts signed updates only" },
  { id = "RUSTSEC-2026-0429", reason = "zip via tauri-plugin-updater: extracts signed updates only" },
]

[licenses]
# The licences the launcher may ship (Apache-2.0 and the permissive licences compatible with it).
# A crate licensed "A OR B" passes when either is here. Copyleft licences (GPL, AGPL, LGPL alone)
# are not allowed.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft (cssparser, selectors, option-ext): shipping them unmodified is fine; a
  # change to their files would have to be published under MPL-2.0.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri, wry and the windows crates bring several majors of some crates; reported, not failed.
multiple-versions = "warn"
# A `*` version requirement takes whatever is published next.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
