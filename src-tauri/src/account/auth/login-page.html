<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Cyber CTF</title>
<style>
  :root {
    --background: #000; --card: #0a0a0a; --foreground: #ededed; --muted: #a1a1a1;
    --border: #262626; --accent: #7c5cf0; --accent-hover: #8a6cf4; --ok: #22c55e; --error: #ef4444;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --background: #fafafa; --card: #fff; --foreground: #171717; --muted: #666;
      --border: #e5e5e5; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
    background: var(--background); color: var(--foreground);
    font: 400 0.9375rem/1.55 Geist, "Geist Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 26rem; padding: 2rem; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem;
  }
  .brand { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { width: 1.75rem; height: 1.75rem; }
  .status {
    margin: 1.75rem auto 1rem; width: 2.75rem; height: 2.75rem; border-radius: 999px;
    display: grid; place-items: center; border: 1px solid var(--border);
  }
  .status svg { width: 1.25rem; height: 1.25rem; }
  .ok .status { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .error .status { color: var(--error); border-color: color-mix(in srgb, var(--error) 35%, transparent); background: color-mix(in srgb, var(--error) 8%, transparent); }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0.5rem 0 0; color: var(--muted); }
  button {
    margin-top: 1.5rem; width: 100%; padding: 0.625rem 1rem; border: 0; border-radius: 0.5rem;
    background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin-top: 0.875rem; font-size: 0.8125rem; }
</style>
</head>
<body class="__STATE__">
<main>
  <div class="brand">__LOGO__<span>Cyber CTF</span></div>
  <div class="status" aria-hidden="true">__ICON__</div>
  <h1>__TITLE__</h1>
  <p>__BODY__</p>
  <button id="back" type="button">__BUTTON__</button>
  <p class="hint">You can close this tab.</p>
</main>
<script>
  // The cyberctf:// scheme brings the running app to the front. window.close() only works for a
  // tab a script opened, so closing is best effort; the hint covers the rest.
  document.getElementById("back").addEventListener("click", function () {
    location.href = "cyberctf://";
    setTimeout(function () { window.open("", "_self"); window.close(); }, 300);
  });
</script>
</body>
</html>
