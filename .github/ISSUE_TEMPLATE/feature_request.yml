name: Feature request
description: Something the launcher should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Screens, commands or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: dropdown
    id: who
    attributes:
      label: Who it is for
      multiple: true
      options:
        - Players
        - Lab authors
        - Administrators deploying it in a company
        - Contributors
