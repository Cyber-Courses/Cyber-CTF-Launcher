name: Linux build dependencies
description: >-
  Install the WebKitGTK/Tauri build dependencies the launcher needs on Linux. Shared by every
  Linux job so the package list lives in one place (ci, coverage, labs, package-smoke, release).
inputs:
  extra-packages:
    description: >-
      Extra apt packages to install alongside the base build dependencies, space separated
      (release adds `curl wget file`; package-smoke adds `xvfb dbus-x11`).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # shellcheck disable=SC2086  # extra-packages is a deliberately word-split package list.
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev \
          libxdo-dev build-essential libssl-dev ${{ inputs.extra-packages }}
