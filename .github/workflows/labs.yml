name: Labs

# Real labs through the launcher's own Rust code on Linux Docker (src-tauri/src/runtime/real_labs.rs):
# a lab is generated and started, its status read, the attack box started beside it and a target
# reached from inside it, the lab's checks run, then the lab stopped and nothing of it left.
# Labs: the Supplier portal API (one network) and Isoloom's `segmented` example (three networks
# behind a router).

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/labs.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTACK_BOX: cyberctf/attack-box
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The attack box is a large image (~14 GB unpacked): Docker keeps its data on the runner's
      # big scratch disk, and the pull runs while the launcher compiles.
      - name: Docker on the scratch disk, attack box pull
        run: |
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt
          nohup docker pull -q "$ATTACK_BOX" > "$RUNNER_TEMP/pull.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pull.pid"
      # Isoloom's example at the commit the launcher builds against (the isoloom-core rev locked in
      # Cargo.lock), not its HEAD: an upstream change can't break or pass this run on its own.
      - name: Fetch the labs
        run: |
          git clone --depth 1 https://github.com/CyberCTF/invoice-portal-api "$RUNNER_TEMP/invoice-portal-api"
          rev=$(grep -A2 '^name = "isoloom-core"$' src-tauri/Cargo.lock | sed -n 's/^source = "git+.*#\([0-9a-f]\{40\}\)"$/\1/p')
          test -n "$rev" || { echo "::error::no isoloom-core git rev in src-tauri/Cargo.lock"; exit 1; }
          echo "Isoloom at $rev"
          git init -q "$RUNNER_TEMP/isoloom"
          git -C "$RUNNER_TEMP/isoloom" fetch -q --depth 1 https://github.com/isoloom/isoloom "$rev"
          git -C "$RUNNER_TEMP/isoloom" checkout -q FETCH_HEAD
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          key: labs
      # Tests don't need the real frontend, but the app embeds ../out at compile time.
      - name: Placeholder frontend
        run: mkdir -p out && echo '<!doctype html>' > out/index.html
      - name: Build the tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Wait for the attack box image
        timeout-minutes: 6
        run: |
          pid=$(cat "$RUNNER_TEMP/pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          cat "$RUNNER_TEMP/pull.log"
          docker image inspect --format '{{.Id}} {{.Size}}' "$ATTACK_BOX"
      - name: Real labs
        timeout-minutes: 8
        env:
          CYBERCTF_TEST_LAB: ${{ runner.temp }}/invoice-portal-api
          CYBERCTF_TEST_SEGMENTED_LAB: ${{ runner.temp }}/isoloom/examples/segmented
          CYBERCTF_TEST_ATTACK_BOX: ${{ env.ATTACK_BOX }}
          ISOLOOM_HOME: ${{ runner.temp }}/isoloom-home
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib real_labs -- --ignored --nocapture --test-threads=1
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
          for p in $(docker ps -a --format '{{.Label "com.docker.compose.project"}}' | sort -u | grep .); do
            echo "::group::compose logs $p"
            docker compose -p "$p" logs --no-color --timestamps || true
            echo "::endgroup::"
          done
          for c in $(docker ps -aq); do
            echo "::group::logs $(docker inspect -f '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          df -h / /mnt
