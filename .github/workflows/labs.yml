name: Labs

# Integration tests through the launcher's own Rust code on Linux Docker (src-tauri/src/integration_tests/docker_lab.rs):
# a lab is generated and started, its status read, the attack box started beside it and a target
# reached from inside it, the lab's checks run, then the lab stopped and nothing of it left.
# Labs: the Supplier portal API (one network) and Isoloom's `segmented` example (three networks
# behind a router); then the attack box added to Isoloom's `solo-web` and taken out. On Linux x64
# and Linux Arm (where the box runs natively on arm64).

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/labs.yml"
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-labs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact attack box the launcher ships as its default, pinned by digest (the attack-box
      # workflow's bump PR changes it, and dispatches this workflow on that PR).
      - name: Pinned attack box
        run: |
          set -euo pipefail
          image=$(jq -er .image src-tauri/attack-box-image.json)
          echo "Attack box: $image"
          echo "ATTACK_BOX=$image" >> "$GITHUB_ENV"
      # The attack box is a large image (~14 GB unpacked): Docker keeps its data on the runner's
      # big scratch disk, and the pull runs while the launcher compiles.
      - uses: ./.github/actions/scratch-disk-docker
      - name: Pull the attack box in the background
        run: |
          set -euo pipefail
          nohup docker pull -q "$ATTACK_BOX" > "$RUNNER_TEMP/pull.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pull.pid"
      # Two labs. Isoloom's example is fetched at the exact isoloom-spec rev locked in Cargo.lock
      # (not its HEAD), so an upstream Isoloom change can't flip this run. invoice-portal-api is
      # cloned at its default-branch HEAD and is NOT pinned: a push to that repo changes what the
      # scheduled/push runs test. Pin it to a tag or commit here if that ever needs to be reproducible.
      - name: Fetch the labs
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CyberCTF/invoice-portal-api "$RUNNER_TEMP/invoice-portal-api"
          # The launcher bundles a published Isoloom (registry crate), so match its version tag; a
          # git-pinned Isoloom (its commit) is still honoured if the lock ever carries one again.
          block=$(grep -A2 '^name = "isoloom-spec"$' src-tauri/Cargo.lock)
          ref=$(sed -n 's/^source = "git+.*#\([0-9a-f]\{40\}\)"$/\1/p' <<<"$block")
          if [ -z "$ref" ]; then
            ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' <<<"$block")
            test -n "$ver" || { echo "::error::no isoloom-spec git rev or version in src-tauri/Cargo.lock"; exit 1; }
            ref="v$ver"
          fi
          echo "Isoloom at $ref"
          git init -q "$RUNNER_TEMP/isoloom"
          git -C "$RUNNER_TEMP/isoloom" fetch -q --depth 1 https://github.com/isoloom/isoloom "$ref"
          git -C "$RUNNER_TEMP/isoloom" checkout -q FETCH_HEAD
      - uses: ./.github/actions/apt-deps
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: labs
      - name: Build the tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Wait for the attack box image
        timeout-minutes: 6
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          cat "$RUNNER_TEMP/pull.log"
          docker image inspect --format '{{.Id}} {{.Size}}' "$ATTACK_BOX"
      - name: Integration tests (Docker labs)
        timeout-minutes: 8
        env:
          CYBERCTF_TEST_INVOICE_LAB: ${{ runner.temp }}/invoice-portal-api
          CYBERCTF_TEST_SEGMENTED_LAB: ${{ runner.temp }}/isoloom/examples/segmented
          CYBERCTF_TEST_HELLO_LAB: ${{ runner.temp }}/isoloom/examples/hello-stack
          CYBERCTF_TEST_BOX_IMAGE: ${{ env.ATTACK_BOX }}
          ISOLOOM_HOME: ${{ runner.temp }}/isoloom-home
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib 'integration_tests::docker_lab::' -- --ignored --nocapture --test-threads=1
      - name: Integration tests (the attack box)
        timeout-minutes: 8
        env:
          CYBERCTF_TEST_BOX_LAB: ${{ runner.temp }}/isoloom/examples/solo-web
          CYBERCTF_TEST_BOX_FORM: docker
          ISOLOOM_HOME: ${{ runner.temp }}/isoloom-home
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib 'integration_tests::attack_box::the_attack_box_is_a_machine_of_the_lab_on_every_local_form' -- --ignored --nocapture --test-threads=1 --exact
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
          for p in $(docker ps -a --format '{{.Label "com.docker.compose.project"}}' | sort -u | grep .); do
            echo "::group::compose logs $p"
            docker compose -p "$p" logs --no-color --timestamps || true
            echo "::endgroup::"
          done
          for c in $(docker ps -aq); do
            echo "::group::logs $(docker inspect -f '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          df -h / /mnt
