name: Coverage

# Rust unit test line coverage of the launcher core, with a floor: a change that drops the
# coverage below it fails. The floor sits 1 point under what main reaches; raise it when the
# coverage goes up (the job summary prints the gap).

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Line coverage floor in percent: ~1 point under main. Raised from 82.5 once new tests for the
  # Docker network diagram, the VM self-test downloads and the runner-error mapping lifted the
  # core's line coverage (measured locally 83.24% -> 83.62%; CI/linux runs a touch higher).
  RUST_LINES_FLOOR: "82.7"

jobs:
  rust-coverage:
    # ubuntu-22.04 to match the glibc floor the ci/release Linux builds use.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/apt-deps
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: |
          set -euo pipefail
          # Collect once, then report from the same data twice (no re-run): a JSON summary the
          # step below parses by field (robust to the text format), and the human table + floor gate.
          cargo llvm-cov --no-report --manifest-path src-tauri/Cargo.toml
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --summary-only --json --output-path coverage.json
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines "$RUST_LINES_FLOOR" | tee coverage.txt
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          # The line-coverage percent from the JSON totals, not a text column.
          lines=""
          if [ -f coverage.json ]; then
            lines=$(jq -r '.data[0].totals.lines.percent // empty' coverage.json 2>/dev/null || true)
          fi
          {
            echo '## Rust line coverage'
            echo
            if [ -n "$lines" ]; then
              lines=$(printf '%.2f' "$lines")
              gap=$(awk -v l="$lines" -v f="$RUST_LINES_FLOOR" 'BEGIN { printf "%+.2f", l - f }')
              echo "| Metric | Covered | Floor | Gap |"
              echo "| --- | --- | --- | --- |"
              echo "| Lines | ${lines}% | ${RUST_LINES_FLOOR}% | ${gap} |"
            else
              echo "No coverage totals (the tests did not finish)."
            fi
            echo
            if [ -f coverage.txt ]; then
              echo '```'
              sed -n '/^Filename/,$p' coverage.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
