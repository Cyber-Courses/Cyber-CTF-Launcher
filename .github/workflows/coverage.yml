name: Coverage

# Rust unit test line coverage of the launcher core, with a floor: a change that drops the
# coverage below it fails. The floor sits 1 point under what main reaches; raise it when the
# coverage goes up (the job summary prints the gap).

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Line coverage floor in percent: 1 point under main (83.51% at e2a52fd).
  RUST_LINES_FLOOR: "82.5"

jobs:
  rust-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      # Tests don't need the real frontend, but the app embeds ../out at compile time.
      - name: Placeholder frontend
        run: mkdir -p out && echo '<!doctype html>' > out/index.html
      - name: Coverage
        run: |
          set -o pipefail
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines "$RUST_LINES_FLOOR" 2>&1 | tee coverage.txt
      - name: Summary
        if: always()
        run: |
          # TOTAL row: Filename, then regions (3 columns), functions (3), lines (3): $10 is the line cover.
          lines=$(awk '/^TOTAL/ { sub(/%/, "", $10); print $10 }' coverage.txt)
          {
            echo '## Rust line coverage'
            echo
            if [ -n "$lines" ]; then
              gap=$(awk -v l="$lines" -v f="$RUST_LINES_FLOOR" 'BEGIN { printf "%+.2f", l - f }')
              echo "| Metric | Covered | Floor | Gap |"
              echo "| --- | --- | --- | --- |"
              echo "| Lines | ${lines}% | ${RUST_LINES_FLOOR}% | ${gap} |"
            else
              echo "No TOTAL row (the tests did not finish)."
            fi
            echo
            echo '```'
            sed -n '/^Filename/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
