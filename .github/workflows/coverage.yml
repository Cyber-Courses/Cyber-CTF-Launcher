name: Coverage

# Rust unit test line coverage of the launcher core, with a floor: a change that drops the
# coverage below it fails. Raise the floor when the coverage goes up.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Tests don't need the real frontend, but the app embeds ../out at compile time.
      - name: Placeholder frontend
        run: mkdir -p out && echo '<!doctype html>' > out/index.html
      - name: Coverage
        run: |
          set -o pipefail
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines 81 2>&1 | tee coverage.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '## Rust line coverage'
            echo
            echo '```'
            sed -n '/^Filename/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
