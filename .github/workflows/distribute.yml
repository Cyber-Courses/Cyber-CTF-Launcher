name: Distribute

# Pushes a release to the package channels so nobody bumps them by hand:
# the Homebrew cask (Cyber-Courses/homebrew-tap) and the apt repository (Cyber-Courses/apt,
# which signs with its own key). The website's download links already follow the latest
# release on their own. Cross-repo writes use the org's cyber-ctf-creator GitHub App.
# Release calls this after publishing a tag build; a release published by hand also
# triggers it, and workflow_dispatch re-runs it for any tag.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      # The cyber-ctf-creator GitHub App credentials used to mint the cross-repo token below.
      APP_ID_GENERATOR:
        required: true
      APP_PRIVATE_KEY_GENERATOR:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.7"
        required: true

# Reads from this repo (gh release download with GITHUB_TOKEN); every cross-repo write goes
# through the cyber-ctf-creator App token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  # One distribution per ref at a time; don't cancel a Homebrew/apt push mid-flight.
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app
        with:
          app-id: ${{ secrets.APP_ID_GENERATOR }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_GENERATOR }}
          owner: Cyber-Courses
          repositories: homebrew-tap,apt

      - name: Bump the Homebrew cask
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # TAG is a maintainer-pushed tag, but guard the value spliced into the sed replacement
          # below so a stray slash or regex metacharacter can't corrupt Casks/cyberctf.rb.
          if [[ ! "$version" =~ ^[0-9A-Za-z.+_-]+$ ]]; then
            echo "::error::refusing to bump the cask with version '$version' (tag '$TAG')"
            exit 1
          fi
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*_${version}_universal.dmg" --output app.dmg
          sha=$(sha256sum app.dmg | cut -d' ' -f1)
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/Cyber-Courses/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${version}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/cyberctf.rb
          git diff --quiet && { echo "Cask already at ${version}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "cyberctf ${version}"
          git push -q

      - name: Publish to the apt repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run publish.yml --repo Cyber-Courses/apt -f tag="$TAG"
