name: E2E

# UI end-to-end tests (Playwright, Chromium): the frontend in a browser with the Tauri commands
# answered by the dev mock (src/lib/dev-mock/). Playwright starts the browser preview itself
# (`pnpm dev:web`). Every spec runs; a failing one, or one that passes only on its retry
# (playwright.config.ts), fails the job. A release tag runs it too (release.yml), before anything
# is built.

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
