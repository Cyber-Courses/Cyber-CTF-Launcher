name: E2E

# UI end-to-end tests (Playwright, Chromium): the frontend in a browser with the Tauri commands
# answered by the dev mock (src/lib/dev-mock/). Playwright starts the browser preview itself
# (`pnpm dev:web`). Every spec runs; a failing one, or one that passes only on its retry
# (playwright.config.ts), fails the job. A release tag runs it too (release.yml), before anything
# is built.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      # Chromium alone, from Playwright's CDN: the runner image already has every library it needs
      # (--with-deps only added fonts for scripts the UI doesn't use), and apt's Ubuntu mirrors,
      # when the runners can't reach them, held the job until its timeout. A library the image ever
      # lacks fails the browser's launch, naming it.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:web
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
