name: CI

# Every pull request and push to main or dev: the frontend (build, types, lint, format, tests) and the
# Rust core (format, lint, tests) on Linux, macOS and Windows, so platform-specific code is at
# least compiled and tested on its own platform. The Linux Rust leg also runs the quality ratchet.

on:
  pull_request:
  push:
    branches: [main, dev]
  # The attack-box workflow's bump PR is opened with GITHUB_TOKEN, which starts no pull_request
  # run; that workflow dispatches this one on the PR's branch instead.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node-pnpm
      # Tauri's JS packages and Rust crates must share a major/minor, or `tauri build` refuses. That
      # check otherwise only runs at release time (release.yml, on a tag, after a long build), so run
      # it here to catch drift on every push. Reads the resolved versions; a few milliseconds.
      - run: pnpm check:tauri
      # The static export; it also generates the route types tsc checks against.
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src scripts e2e
      - run: pnpm exec prettier --check "{src,scripts,e2e}/**/*.{ts,tsx,css,mjs}"
      - run: pnpm exec vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Every platform the launcher ships for, on the runners release.yml builds it on: Linux
        # x64 and Arm on ubuntu-22.04 (the glibc floor the installers target), Windows x64 and Arm,
        # and macOS on Apple Silicon and Intel (the universal app's two halves).
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/apt-deps
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Format
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Lints at "deny" (Cargo.toml) fail here. Warn-level lints are held to quality-baseline.json
      # by the quality ratchet, the Quality step below.
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      # The quality ratchet (`pnpm quality`, also part of `pnpm check`): clippy as JSON, ESLint, the
      # source scans, jscpd, knip and cargo machete, held to quality-baseline.json; a count above the
      # baseline fails. It needs the clippy toolchain and the Node tooling together, so it runs on
      # the Linux leg here, after Lint: its clippy run replays the diagnostics already cached above.
      - if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/setup-node-pnpm
      - if: startsWith(matrix.os, 'ubuntu')
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete
      - name: Quality
        if: startsWith(matrix.os, 'ubuntu')
        run: pnpm quality
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # The tests rewrite the TypeScript command types from the Rust structs (ts_bindings.rs):
      # a changed struct whose types weren't regenerated and committed fails here.
      - name: Generated TypeScript types are committed
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- src/lib/tauri/generated)" ]; then
            git status --short -- src/lib/tauri/generated
            git diff -- src/lib/tauri/generated
            echo "::error::src/lib/tauri/generated differs from the Rust structs: run cargo test and commit the result"
            exit 1
          fi
