name: CI

# Every pull request and push to main: the frontend (build, types, lint, format, tests) and the
# Rust core (format, lint, tests) on Linux, macOS and Windows, so platform-specific code is at
# least compiled and tested on its own platform.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The static export; it also generates the route types tsc checks against.
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src
      - run: pnpm exec prettier --check "src/**/*.{ts,tsx,css}"
      - run: pnpm exec vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev build-essential libssl-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
      # Tests don't need the real frontend, but the app embeds ../out at compile time.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p out && echo '<!doctype html>' > out/index.html
      - name: Format
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # The tests rewrite the TypeScript command types from the Rust structs (ts_bindings.rs):
      # a changed struct whose types weren't regenerated and committed fails here.
      - name: Generated TypeScript types are committed
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          if [ -n "$(git status --porcelain -- src/lib/tauri/generated)" ]; then
            git status --short -- src/lib/tauri/generated
            git diff -- src/lib/tauri/generated
            echo "::error::src/lib/tauri/generated differs from the Rust structs: run cargo test and commit the result"
            exit 1
          fi
