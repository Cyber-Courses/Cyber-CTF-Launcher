name: Lint infrastructure

# Static checks of the files around the app: the workflows (actionlint, with shellcheck on their
# run: scripts), the Terraform templates the launcher writes at run time, the repo's shell
# scripts, and the JSON the app and the Microsoft Store listing ship (with Partner Center's
# limits, which otherwise only fail at release time).

on:
  pull_request:
    paths:
      - ".github/**"
      - "**/*.tf"
      - "**/*.hcl"
      - "**/*.sh"
      - "images/attack-box/**"
      - "src/messages/**"
      - "packaging/store/**"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        # Download the pinned release tarball and verify its sha256 before running it, so a moved or
        # compromised release asset can't run unverified in CI. Bump ACTIONLINT_VERSION and both
        # checksums together (from the release's actionlint_<version>_checksums.txt).
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=$ACTIONLINT_SHA256_AMD64 ;;
            aarch64 | arm64) arch=arm64; sha=$ACTIONLINT_SHA256_ARM64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version
      # shellcheck is on the runner image; actionlint runs it on every run: script.
      - run: ./actionlint -color
      # Every action is pinned to a full commit SHA (a tag or branch can be moved to new code,
      # which then runs with this repo's secrets), with its version in a comment for updates.
      # Covers the composite actions under .github/actions/ as well as the workflows.
      # scripts/check/infra.sh, which pnpm release-check runs too.
      - name: Actions pinned to commit SHAs
        run: scripts/check/infra.sh pins

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .terraform-plugins
          key: terraform-plugins-${{ hashFiles('**/*.tf', '**/terraform.lock.hcl', '**/.terraform.lock.hcl') }}
      - name: Format
        run: |
          set -euo pipefail
          git ls-files '*.tf' | xargs -r dirname | sort -u | while read -r dir; do
            echo "terraform fmt -check $dir"
            terraform fmt -check -diff "$dir"
          done
      - name: Init and validate
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          git ls-files '*.tf' | xargs -r dirname | sort -u | while read -r dir; do
            echo "::group::terraform validate $dir"
            # A copy, so nothing lands in the repo. The launcher ships its lock file as
            # terraform.lock.hcl (no dot, see server_selftest/proxmox.rs): use it as the lock.
            work=$(mktemp -d)
            cp "$dir"/*.tf "$work"/
            for lock in "$dir/terraform.lock.hcl" "$dir/.terraform.lock.hcl"; do
              if [ -f "$lock" ]; then cp "$lock" "$work/.terraform.lock.hcl"; fi
            done
            lockfile=()
            if [ -f "$work/.terraform.lock.hcl" ]; then lockfile=(-lockfile=readonly); fi
            terraform -chdir="$work" init -backend=false -input=false -no-color "${lockfile[@]}"
            terraform -chdir="$work" validate -no-color
            echo "::endgroup::"
          done

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Warnings and errors fail; style notes (info) don't. Intentional exceptions are marked
      # in the scripts with `# shellcheck disable=...` and a reason.
      # scripts/check/infra.sh, which pnpm release-check runs too.
      - run: |
          set -euo pipefail
          shellcheck --version
          scripts/check/infra.sh shellcheck

  json-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-store-listings.py
