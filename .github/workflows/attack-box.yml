name: Attack box image

# Builds cyberctf/attack-box (attack-box/Dockerfile) for amd64 and arm64 on native runners and
# publishes one multi-arch tag to Docker Hub. Rebuilt weekly because Kali is a rolling release.
# Every run first builds the image locally and smoke-tests it (attack-box/smoke-test.sh), on pull
# requests too; only a push to main, the weekly run or a manual run publishes, and only once the
# smoke test passed on both architectures, so a broken Kali update never reaches players.
# The launcher doesn't follow `latest`: its default is the image pinned by digest in
# src-tauri/attack-box-image.json. Once a publish is out, the pushed digest is pulled and smoke-tested
# again on both architectures, then a bot PR moves the launcher's default to it (and the real-labs
# and CI workflows are dispatched on that PR, since a GITHUB_TOKEN PR starts no runs by itself).
on:
  pull_request:
    paths: ["attack-box/**", ".github/workflows/attack-box.yml"]
  push:
    branches: [main]
    paths: ["attack-box/**", ".github/workflows/attack-box.yml"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: attack-box-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: cyberctf/attack-box

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image is large (~14 GB unpacked): Docker keeps its data on the runner's scratch disk
      # where there is one (as in labs.yml).
      - name: Docker on the scratch disk
        run: |
          if sudo test -d /mnt; then
            sudo systemctl stop docker docker.socket
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          docker info --format '{{.DockerRootDir}}'
          df -h / /mnt || true
      # No registry, no secrets: a plain local build, so pull requests from forks run it too.
      - name: Build
        run: docker build --pull -t attack-box:smoke attack-box
      - name: Smoke test
        run: attack-box/smoke-test.sh attack-box:smoke

  build:
    needs: smoke
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Organization access token: the username is the Docker Hub organization.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: attack-box
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      # One tag for both architectures: latest, plus the build date to pin or roll back.
      - working-directory: /tmp/digests
        run: |
          # One argument per digest file: the split is the point.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
      # The multi-arch index just pushed: what the launcher pins.
      - id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The pushed image itself, by digest, on both architectures: the smoke job tested a local build.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Docker on the scratch disk
        run: |
          if sudo test -d /mnt; then
            sudo systemctl stop docker docker.socket
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
          fi
      - name: Smoke test the published image
        env:
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          docker pull -q "$PINNED"
          attack-box/smoke-test.sh "$PINNED"

  # A PR moving the launcher's default attack box to the digest just published and verified.
  bump:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bot/attack-box-digest
      FILE: src-tauri/attack-box-image.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          current=$(jq -er .image "$FILE")
          if [ "$current" = "$PINNED" ]; then
            echo "The launcher already pins $PINNED"
            exit 0
          fi
          # The old default joins `previous`, so a player's saved old default moves to the new one.
          jq --arg new "$PINNED" '.previous = ([.image] + .previous | map(select(. != $new)) | unique) | .image = $new' "$FILE" > "$RUNNER_TEMP/image.json"
          mv "$RUNNER_TEMP/image.json" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -qam "Attack box: pin ${PINNED#*@}" -m "Published and smoke-tested by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push -f origin "$BRANCH"
          title="Attack box: pin the $(date -u +%Y-%m-%d) image"
          body="Moves the launcher's default attack box to \`$PINNED\` (\`$IMAGE:$(date -u +%Y-%m-%d)\`), published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The real-labs and CI workflows run on this branch by dispatch."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body "$body"
          fi
          # A GITHUB_TOKEN push starts no workflow; dispatched runs do, and report on the PR's commit.
          gh workflow run labs.yml --ref "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
