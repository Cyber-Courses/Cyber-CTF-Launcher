name: Attack box image

# Builds cyberctf/attack-box (images/attack-box/Dockerfile) for amd64 and arm64 on native runners and
# publishes one multi-arch tag to Docker Hub. Rebuilt weekly because Kali is a rolling release.
# Every run first builds the image locally and smoke-tests it (images/attack-box/smoke-test.sh), on pull
# requests too; only a push to main, the weekly run or a manual run publishes, and only once the
# smoke test passed on both architectures, so a broken Kali update never reaches players.
# The launcher doesn't follow `latest`: its default is the image pinned by digest in
# src-tauri/attack-box-image.json. Once a publish is out, the pushed digest is pulled and smoke-tested
# again on both architectures, then a bot PR moves the launcher's default to it (and the labs
# and CI workflows are dispatched on that PR, since a GITHUB_TOKEN PR starts no runs by itself).
on:
  pull_request:
    paths: ["images/attack-box/**", ".github/workflows/attack-box.yml"]
  push:
    branches: [main]
    paths: ["images/attack-box/**", ".github/workflows/attack-box.yml"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: attack-box-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: cyberctf/attack-box

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image is large (~14 GB unpacked): Docker keeps its data on the runner's scratch disk.
      - uses: ./.github/actions/scratch-disk-docker
      # No registry, no secrets: a plain local build, so pull requests from forks run it too.
      - name: Build
        run: docker build --pull -t attack-box:smoke images/attack-box
      - name: Smoke test
        run: images/attack-box/smoke-test.sh attack-box:smoke

  build:
    needs: smoke
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Organization access token: the username is the Docker Hub organization.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/attack-box
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      # One tag for both architectures: latest, plus the build date to pin or roll back.
      - working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # One argument per digest file: the split is the point.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
      # The multi-arch index just pushed: what the launcher pins.
      - id: digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The pushed image itself, by digest, on both architectures: the smoke job tested a local build.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scratch-disk-docker
      - name: Smoke test the published image
        env:
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull -q "$PINNED"
          images/attack-box/smoke-test.sh "$PINNED"

  # A PR moving the launcher's default attack box to the digest just published and verified.
  bump:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bot/attack-box-digest
      FILE: src-tauri/attack-box-image.json
    steps:
      # The bump goes to dev, the staging branch; it reaches main with the next release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          current=$(jq -er .image "$FILE")
          if [ "$current" = "$PINNED" ]; then
            echo "The launcher already pins $PINNED"
            exit 0
          fi
          # The old default joins `previous`, so a player's saved old default moves to the new one.
          jq --arg new "$PINNED" '.previous = ([.image] + .previous | map(select(. != $new)) | unique) | .image = $new' "$FILE" > "$RUNNER_TEMP/image.json"
          mv "$RUNNER_TEMP/image.json" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -qam "Attack box: pin ${PINNED#*@}" -m "Published and smoke-tested by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push -f origin "$BRANCH"
          title="Attack box: pin the $(date -u +%Y-%m-%d) image"
          body="Moves the launcher's default attack box to \`$PINNED\` (\`$IMAGE:$(date -u +%Y-%m-%d)\`), published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The labs and CI workflows run on this branch by dispatch."
          # `gh pr edit` fails on repos that still list classic Projects; the REST call doesn't.
          number=$(gh pr list --head "$BRANCH" --base dev --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -f body="$body" > /dev/null
          else
            gh pr create --head "$BRANCH" --base dev --title "$title" --body "$body"
          fi
          # A GITHUB_TOKEN push starts no workflow; dispatched runs do, and report on the PR's commit.
          gh workflow run labs.yml --ref "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
