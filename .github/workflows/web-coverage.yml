name: Web coverage

# Every pull request and push to main: the frontend unit and component tests with coverage over
# all of src (vitest.config.mts). The thresholds there fail the job when coverage drops; the
# totals land in the run's summary.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage
        run: pnpm exec vitest run --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary (the tests did not finish)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # JavaScript in single quotes: its ${...} are template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k[0].toUpperCase() + k.slice(1)} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Frontend coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
