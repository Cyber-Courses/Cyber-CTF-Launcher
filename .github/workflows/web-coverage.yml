name: Web coverage

# Every pull request and push to main: the frontend unit and component tests with coverage over
# all of src (vitest.config.mts). The thresholds there fail the job when coverage drops; the
# totals land in the run's summary.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A branch's newer push cancels its older run; on main every commit keeps a run of its own,
  # so each one gets a verdict while several pushes land close together.
  group: web-coverage-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Tests with coverage
        run: pnpm exec vitest run --coverage
      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary (the tests did not finish)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # JavaScript in single quotes: its ${...} are template literals, not shell expansions.
          # The floors are read from the `thresholds` block of vitest.config.mts.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const t = require("./coverage/coverage-summary.json").total;
            const block = (fs.readFileSync("vitest.config.mts", "utf8").match(/thresholds:\s*\{([^}]*)\}/) || [])[1] || "";
            const floor = Object.fromEntries([...block.matchAll(/(\w+):\s*([\d.]+)/g)].map((m) => [m[1], Number(m[2])]));
            const gap = (k) => (k in floor ? `${floor[k]}% | ${(t[k].pct - floor[k] >= 0 ? "+" : "") + (t[k].pct - floor[k]).toFixed(2)}` : "- | -");
            const row = (k) => `| ${k[0].toUpperCase() + k.slice(1)} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} | ${gap(k)} |`;
            console.log(["### Frontend coverage", "", "| Metric | Covered | Count | Floor | Gap |", "| --- | --- | --- | --- | --- |", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
