name: Native GUI e2e

# The real app binary (`pnpm tauri build`, which embeds the static export, with the embedded
# WebDriver server, `--features wdio`, and the frontend's test hooks, `NEXT_PUBLIC_WDIO=1`) driven
# through its own window under Xvfb, against the runner's Docker engine: the scenarios in
# tests/desktop/, as scripts/release/release-check.sh runs them on a developer machine
# (docs/testing/release-check.md).
# Manual for now: the scenarios build the fixture lab's images and take a while, and a Linux
# runner has no hypervisor, so the VM scan is skipped here (a Mac with UTM runs it locally).
# Promote to a schedule once a few manual runs are green.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-deps
        with:
          # xvfb + dbus-x11 to open the app's window headlessly, as package-smoke does.
          extra-packages: xvfb dbus-x11
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: native-e2e
          # `tauri build` embeds the real frontend, so no dev server is needed under Xvfb.
          placeholder-frontend: "false"
      # `tauri build`, not `cargo build --release`: only the Tauri CLI turns on the
      # `custom-protocol` feature that embeds out/; a plain cargo build loads devUrl
      # (127.0.0.1:3206), which nothing serves here. Its beforeBuildCommand (`pnpm build`) exports
      # the frontend with NEXT_PUBLIC_WDIO=1, which keeps the __wdio_* hooks the scenarios call.
      - name: Build the wdio app with its frontend
        env:
          NEXT_PUBLIC_WDIO: "1"
        run: pnpm tauri build --features wdio --no-bundle
      - name: Run the native scenarios
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_BACKTRACE: "1"
        run: xvfb-run -a dbus-run-session -- pnpm test:desktop --app "$GITHUB_WORKSPACE/src-tauri/target/release/cyberctf-desktop"
      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-e2e-logs
          path: tests/desktop/.state/logs
          if-no-files-found: ignore
