name: Native GUI e2e

# The real app binary (a release build with the embedded WebDriver server, `--features wdio`)
# driven through its own window under Xvfb, against the runner's Docker engine: the scenarios in
# e2e/desktop/, as scripts/release-check.sh runs them on a developer machine (docs/testing/release-check.md).
# Manual for now: the scenarios build the fixture lab's images and take a while, and a Linux
# runner has no hypervisor, so the VM scan is skipped here (a Mac with UTM runs it locally).
# Promote to a schedule once a few manual runs are green.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/apt-deps
        with:
          # xvfb + dbus-x11 to open the app's window headlessly, as package-smoke does.
          extra-packages: xvfb dbus-x11
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: native-e2e
          # A release build embeds the real frontend, so no dev server is needed under Xvfb.
          placeholder-frontend: "false"
      - name: Build the frontend and the wdio app
        run: |
          set -euo pipefail
          pnpm build
          cargo build --release --manifest-path src-tauri/Cargo.toml --features wdio
      - name: Run the native scenarios
        env:
          APP_BIN: ${{ github.workspace }}/src-tauri/target/release/cyberctf-desktop
          SKIP_BUILD: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_BACKTRACE: "1"
        run: xvfb-run -a dbus-run-session -- e2e/desktop/run.sh
      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-e2e-logs
          path: e2e/desktop/.state/logs
          if-no-files-found: ignore
