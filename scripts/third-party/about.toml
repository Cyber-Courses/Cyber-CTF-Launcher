# cargo-about: the licences of the Rust crates the launcher ships, for THIRD_PARTY_NOTICES
# (scripts/third-party.ts). Keep `accepted` in line with src-tauri/deny.toml, which enforces it.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Every platform the launcher ships for.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
# Only what is compiled into the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
